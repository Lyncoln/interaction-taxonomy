  const hits = R.map(r=>{ const tip = `${nm(r)} — ${r.papers} papers: interactions ${r.I}/${CE.I}, actions ${r.A}/${CE.A}, modifications ${r.M}/${CE.M}, candidates ${r.K}` + (r.new.length?`. New: ${r.new.map(x=>x.id).join(', ')}`:'. Nothing new');
    return `<rect x="${X(r.papers)-14}" y="${t}" width="28" height="${H-t-b}" fill="transparent" data-tip="${sae(tip)}"/>`; }).join('');
  const chart1 = `<div class="legend2">${['I','A','M'].map(k=>`<span class="lg"><i style="background:${LV[k][1]}"></i>${LV[k][0]} (of ${CE[k]})</span>`).join('')}</div>
    <div class="cwide"><svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="share of the catalog in use after each round">${grid}${xt}${ser}${hits}</svg></div>`;
  /* chart 2: new codes per round, stacked by level */
  const R2 = R.slice(1), N2 = R2.length;   /* the first round finds everything at once: it is left out of the scale and reported in the subtitle */
  const W2 = SCH.WW, H2 = 230, l2 = 46, t2 = 18, b2 = 46, mx = Math.max(...R2.map(r=>r.new.length), 4), bw = (W2-l2-20)/N2;
  const Y2 = v => t2 + (H2-t2-b2)*(1 - v/mx);
  const bars = R2.map((r,i)=>{ let acc = 0; const x = l2 + i*bw + bw*0.2, w = bw*0.6;
    const segs = ['I','A','M','K'].map(k=>{ const n = newOf(r,k).length; if(!n) return ''; const y1 = Y2(acc+n), y0 = Y2(acc); acc += n;
      return `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1,y0-y1-2)}" rx="2" style="fill:${LV[k][1]}" data-tip="${sae(nm(r)+' · '+LV[k][0]+': '+codes(r,k))}"/>`; }).join('');
    return `${segs}<text x="${x+w/2}" y="${Y2(acc)-5}" text-anchor="middle" class="sv">${r.new.length||'0'}</text>
      <text x="${x+w/2}" y="${H2-b2+16}" text-anchor="middle" class="st">${sae(r.label.replace('first 10 papers','first 10'))}</text><text x="${x+w/2}" y="${H2-b2+30}" text-anchor="middle" class="st">${r.date}</text>`; }).join('');
  const chart2 = `<div class="legend2">${['I','A','M','K'].map(k=>`<span class="lg"><i style="background:${LV[k][1]}"></i>${LV[k][0]}</span>`).join('')}</div>
    <div class="cwide"><svg viewBox="0 0 ${W2} ${H2}" class="schart" role="img" aria-label="new codes per round"><line x1="${l2}" x2="${W2-20}" y1="${Y2(0)}" y2="${Y2(0)}" class="sax"/>${bars}</svg></div>`;
  /* table */
  const th = ['Round','Papers','Operations','Interactions','Actions','Modifications','Candidates','Gesture not described','No catalog action','New codes'];
  const rows = R.map(r=>`<tr><td>${sae(nm(r))}</td><td>${r.papers} <small>(${spct(r.papers,S.meta.corpus)}%)</small></td><td>${r.rows} <small>(${sfmt(r.rows/r.papers)}/paper)</small></td>
     <td>${r.I}/${CE.I}</td><td>${r.A}/${CE.A}</td><td>${r.M}/${CE.M}</td><td>${r.K}</td><td>${spct(r.noGesture,r.rows)}%</td><td>${spct(r.noAction,r.rows)}%</td>
     <td class="cnew">${r.new.length?r.new.map(x=>`<span class="cchip" data-tip="${sae(x.id+' '+x.name)}" style="border-color:${LV[x.level][1]}"><b>${x.id}</b></span>`).join(' '):'—'}</td></tr>`).join('');
  const table = `<div class="ctable"><table><thead><tr>${th.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  const tile = (v,l,s) => `<div class="stile"><b>${v}</b><span>${l}</span>${s?`<em>${s}</em>`:''}</div>`;
  const used = last.I+last.A+last.M, all = CE.I+CE.A+CE.M;
  const k3 = R.slice(-3), add3 = k3.reduce((a,r)=>a+r.added,0), new3 = k3.reduce((a,r)=>a+r.new.filter(x=>x.level!=='K').length,0);
  const card = (t, sub, body) => `<section class="scard"><h3>${t}</h3>${sub?`<p class="ssub">${sub}</p>`:''}${body}</section>`;
  main.innerHTML = `<div class="wrap page stats tipscope">
   <section class="dimsec"><h2>Convergence</h2><p class="ssub">How the general metrics looked each time more papers were added. Every round is recomputed with the current coding of its papers, so all rounds follow the same rules and can be compared. If new rounds stop adding codes, coding more papers adds little to the catalog.</p></section>
   <div class="stiles">${tile(`${used}/${all}`, 'catalog codes in use', `interactions ${last.I}/${CE.I} · actions ${last.A}/${CE.A} · modifications ${last.M}/${CE.M}`)}${tile(new3, 'new codes in the last 3 rounds', `${add3} papers added; ${k3.reduce((a,r)=>a+r.new.filter(x=>x.level==='K').length,0)} new candidates`)}${tile(last.K, 'candidates', 'gaps the catalog does not cover')}${tile(`${R[0].date}–${last.date}`, `${N} rounds`, `${last.papers} papers, ${last.rows} operations`)}</div>
   ${card('Share of each catalog in use after each round', 'Points mark the end of each round, placed by the number of papers coded so far. Hover a point for the values and the codes that appeared.', chart1)}
   ${card('New codes in each round', `Codes seen for the first time in the round, from the second round on (the first ${R[0].added} papers brought ${R[0].new.length} codes at once). Candidates are gaps the catalog does not cover (see Statistics). Hover a segment for the codes.`, chart2)}
   ${card('General metrics at each round', 'Cumulative values at the end of each round. Hover a code for its name.', table)}
  </div>`;
}

function render(){
  index(); renderHeader();
  if(st.tab!=='sim' && typeof pause==='function') pause();
  if(st.tab==='explore') renderExplore(); else if(st.tab==='sim') renderSim(); else if(st.tab==='dims') renderDims(); else if(st.tab==='stats') renderStats(); else if(st.tab==='conv') renderConv(); else renderSources();
}
function select(t,id){
  st.sel = (st.sel && st.sel.t===t && st.sel.id===id) ? null : {t,id};
  if(st.sel) st.col = t;
  renderExplore();
  const d = document.getElementById('detail'); if(d) d.scrollTop = 0;
  if(st.sel){ const el = document.querySelector('[id="it-'+id+'"]'); if(el && window.innerWidth>760) el.scrollIntoView({block:'nearest'}); }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-lang]');
  if(e.target.id==='backdrop'){ st.sel=null; renderExplore(); return; }
  if(!b) return;
  if(b.dataset.tab){ st.tab = b.dataset.tab; render(); if(st.tab==='sim'){ SIM.t=0; play(); } return; }
  if(b.dataset.g || b.dataset.g2){
    const which = b.dataset.g ? 'g' : 'g2', t = b.dataset.g || b.dataset.g2, n = dimsOf(t).length;
    st[which][t] = (st[which][t] + Number(b.dataset.step) + n) % n;
    if(st.g[t] === st.g2[t]) st.g2[t] = (st.g2[t] + 1) % n;
    renderExplore(); return; }
  if(b.dataset.col){ st.col = b.dataset.col; renderExplore(); return; }
  if(b.dataset.simt){ openSim(b.dataset.simt, b.dataset.simid); return; }
  if(b.id==='clear' || b.id==='close'){ st.sel = null; renderExplore(); return; }
  if(b.dataset.t && b.dataset.id){ if(st.tab!=='explore'){ st.tab='explore'; render(); } select(b.dataset.t, b.dataset.id); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && st.sel){ st.sel=null; renderExplore(); } });
window.addEventListener('resize', ()=>backdrop.classList.toggle('on', !!st.sel && st.tab==='explore' && window.innerWidth<=1180));

index();
if(window.innerWidth>1180){ const f = D.actions.find(a=>a.name==='Filter'); if(f) st.sel = {t:'a', id:f.id}; }
render();
})();
</script>
