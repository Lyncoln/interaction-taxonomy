<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interaction Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F2F6; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --ink:#161821; --ink-2:#4A4F5E; --ink-3:#777D8E;
  --rule:#DADDE6; --rule-soft:#E8EAF0;
  --int:#1F7A68; --int-soft:#E3F2EE; --int-ink:#17614F;
  --act:#3B4CC0; --act-soft:#E9ECFA; --act-ink:#2E3C9E;
  --out:#A5690A; --out-soft:#FAF0DC; --out-ink:#7F5006;
  --warn:#B40426; --warn-soft:#FAEBEE;
  --shadow:0 10px 30px rgba(22,24,33,.12);
  --p0:#8A7CC2; --p1:#D07A8C; --p2:#6C8FB3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1016; --surface:#161922; --surface-2:#1B1F29;
    --ink:#E8EAF1; --ink-2:#A8AEBE; --ink-3:#7C8396;
    --rule:#2A2F3C; --rule-soft:#222733;
    --int:#5CC2A8; --int-soft:#13271F; --int-ink:#7FD6BF;
    --act:#8B99EE; --act-soft:#1C2135; --act-ink:#A3AEF3;
    --out:#E3B462; --out-soft:#2A2213; --out-ink:#EDC57F;
    --warn:#EC8195; --warn-soft:#2C1A20;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --p0:#A99DDB; --p1:#E394A3; --p2:#8FB0D0;
  }
}
:root[data-theme="dark"]{
  --p0:#A99DDB; --p1:#E394A3; --p2:#8FB0D0;
  --paper:#0E1016; --surface:#161922; --surface-2:#1B1F29;
  --ink:#E8EAF1; --ink-2:#A8AEBE; --ink-3:#7C8396;
  --rule:#2A2F3C; --rule-soft:#222733;
  --int:#5CC2A8; --int-soft:#13271F; --int-ink:#7FD6BF;
  --act:#8B99EE; --act-soft:#1C2135; --act-ink:#A3AEF3;
  --out:#E3B462; --out-soft:#2A2213; --out-ink:#EDC57F;
  --warn:#EC8195; --warn-soft:#2C1A20;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-inline:20px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:Spectral,Georgia,serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,2.5rem);letter-spacing:-.015em}
h2{font-family:Spectral,Georgia,serif;font-weight:600;font-size:1.45rem}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lab{font:500 .68rem "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header */
header.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top-inner{display:grid;gap:18px;padding-block:28px 0}
.titlerow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--ink-2);max-width:70ch;margin-top:6px}
.langs{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:5px 12px;font:500 .78rem "IBM Plex Mono",monospace;cursor:pointer;color:var(--ink-3)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.link{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:6px;min-width:0;flex:1 1 200px}
.link b{display:block;font-size:.95rem}
.link span{display:block;font-size:.82rem;color:var(--ink-2)}
.link .num{font:500 1.35rem Spectral,serif;margin-left:auto;padding-left:8px}
.link.i{background:var(--int-soft);color:var(--int-ink)} .link.a{background:var(--act-soft);color:var(--act-ink)} .link.o{background:var(--out-soft);color:var(--out-ink)}
.link svg.ic{width:26px;height:26px}
.arrow{align-self:center;color:var(--ink-3);font-size:1.2rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.84rem;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;margin-top:4px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--ink-3);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

/* ---------- toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:16px}
.search{flex:1 1 240px;min-width:0;max-width:420px;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.selpath{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--ink-2)}
.clear{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.colswitch{display:none;gap:4px;width:100%}
.colswitch button{flex:1;border:1px solid var(--rule);background:var(--surface);padding:7px;border-radius:4px;font-size:.85rem;cursor:pointer}
.colswitch button[aria-pressed="true"].i{background:var(--int);color:#fff;border-color:var(--int)}
.colswitch button[aria-pressed="true"].a{background:var(--act);color:#fff;border-color:var(--act)}
.colswitch button[aria-pressed="true"].o{background:var(--out);color:#fff;border-color:var(--out)}

/* ---------- explorer */
.explorer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:40px;align-items:start}
.explorer.withdetail{grid-template-columns:repeat(3,minmax(0,1fr)) 420px}
.col{background:var(--surface);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 150px);min-height:480px}
.colhead{padding:14px 14px 10px;border-bottom:1px solid var(--rule-soft);display:grid;gap:8px;min-width:0}
.colhead > *{min-width:0}
.colhead .t{display:flex;gap:9px;align-items:center}
.colhead h2{font-size:1.2rem}
.colhead .cnt{margin-left:auto;font:.78rem "IBM Plex Mono",monospace;color:var(--ink-3)}
.col.i .colhead .t{color:var(--int-ink)} .col.a .colhead .t{color:var(--act-ink)} .col.o .colhead .t{color:var(--out-ink)}
.col.i{border-top:3px solid var(--int)} .col.a{border-top:3px solid var(--act)} .col.o{border-top:3px solid var(--out)}
.groupby{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.76rem;color:var(--ink-3)}
.groupby button{border:1px solid var(--rule);background:none;border-radius:999px;padding:2px 9px;cursor:pointer;font-size:.76rem;color:var(--ink-2)}
.groupby button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{overflow-y:auto;padding:6px 8px 12px;flex:1}
.grp{margin-top:8px}
.grp-h{display:flex;gap:7px;align-items:center;padding:6px 6px 4px;font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grp-h svg.ic{width:15px;height:15px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:5px;padding:7px 8px;cursor:pointer;transition:opacity .15s,background .15s}
.item:hover{background:var(--surface-2)}
.item .ico{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;flex:none}
.col.i .ico{background:var(--int-soft);color:var(--int)} .col.a .ico{background:var(--act-soft);color:var(--act)} .col.o .ico{background:var(--out-soft);color:var(--out)}
.item .txt{flex:1;min-width:0;display:grid;gap:2px}
.item .nm{min-width:0;font-size:.93rem;line-height:1.3}
.item .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .d2{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;color:var(--ink-3)}
.item .d2 svg.ic{width:13px;height:13px}
.dimslider{display:flex;align-items:center;gap:6px;font-size:.78rem;min-width:0}
.dimslider .lab2{font:500 .62rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);width:52px;flex:none;line-height:1.15}
.dimslider .arw{border:1px solid var(--rule);background:var(--surface);border-radius:4px;width:22px;height:22px;line-height:1;cursor:pointer;color:var(--ink-2);flex:none;padding:0}
.dimslider .arw:hover{border-color:var(--ink-3)}
.dimslider .dname{flex:1;min-width:0;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dimslider .dots{display:flex;gap:3px;flex:none}
.dimslider .dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dimslider .dots i.un{background:none;border:1px solid var(--rule)}
.dimslider .dots i.on{background:var(--ink-3)}
.dvals{font-size:.72rem;color:var(--ink-3);line-height:1.4}
.dvals b{color:var(--warn);font-weight:500}
.item .d2 .k{color:var(--ink-3)}
.col.i .item .nm{font-family:"IBM Plex Mono",monospace;font-size:.88rem}
.item .meta{margin-left:auto}
.item .meta{font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.item .meta.gap{color:var(--warn)}
.list.hasSel .item{opacity:.3}
.list.hasSel .item.l1,.list.hasSel .item.l2,.list.hasSel .item.sel{opacity:1}
.col.i .item.l1{background:var(--int-soft)} .col.a .item.l1{background:var(--act-soft)} .col.o .item.l1{background:var(--out-soft)}
.item.l2{border-style:dashed;border-color:var(--rule)}
.col.i .item.sel{border-color:var(--int);background:var(--int-soft)} .col.a .item.sel{border-color:var(--act);background:var(--act-soft)} .col.o .item.sel{border-color:var(--out);background:var(--out-soft)}
.item.sel .ico{color:#fff} .col.i .item.sel .ico{background:var(--int)} .col.a .item.sel .ico{background:var(--act)} .col.o .item.sel .ico{background:var(--out)}
.empty{padding:20px;color:var(--ink-3);font-size:.85rem;text-align:center}

/* ---------- detail */
.detail{background:var(--surface);border:1px solid var(--rule);border-radius:6px;max-height:calc(100vh - 150px);overflow-y:auto;position:sticky;top:12px}
.detail[hidden]{display:none}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--rule-soft);display:grid;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .row{display:flex;gap:10px;align-items:center}
.dhead .ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.dhead .ico svg.ic{width:22px;height:22px}
.dhead h2{font-size:1.4rem}
.dhead h2.mono{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:1.25rem}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:1.3rem;line-height:1;padding:4px 6px}
.dbody{padding:16px 20px 24px;display:grid;gap:22px}
.dbody section{display:grid;gap:8px}
.lead{font-size:.95rem;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px 3px 7px;border-radius:999px;font-size:.8rem;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-2)}
.chip svg.ic{width:15px;height:15px}
.chip .k{color:var(--ink-3)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink-3)}
.chip.i{background:var(--int-soft);color:var(--int-ink);border-color:transparent;font-family:"IBM Plex Mono",monospace}
.chip.a{background:var(--act-soft);color:var(--act-ink);border-color:transparent}
.chip.o{background:var(--out-soft);color:var(--out-ink);border-color:transparent}
.why{display:grid;gap:10px}
.src{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--rule)}
.src.D{border-color:var(--ink-2)} .src.X{border-color:var(--warn)}
.src .who{font-size:.84rem;color:var(--ink)} .src .who b{font-weight:600}
.src .who .role{font:500 .68rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.src.X .role{color:var(--warn)}
blockquote{margin:0;font:italic .95rem/1.5 Spectral,Georgia,serif;color:var(--ink);overflow-wrap:anywhere}
.loc{font:.72rem "IBM Plex Mono",monospace;color:var(--ink-3)}
.callout{padding:10px 12px;border-radius:5px;background:var(--warn-soft);color:var(--ink);font-size:.86rem}
.note{font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:10px 12px}
.impl{border:1px solid var(--rule-soft);border-radius:6px;padding:10px 12px;display:grid;gap:7px}
.impl .ih{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.impl .ih b{font-weight:600}
.surf{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;color:var(--ink-3);margin-left:auto}
.surf svg.ic{width:14px;height:14px}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seq .sep{color:var(--ink-3);font-size:.8rem}
.orig{font-size:.74rem;color:var(--ink-3)}
.orig.T{color:var(--warn)}
.prod{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--rule-soft)}
.prod:first-of-type{border-top:0}
.backdrop{display:none}

/* ---------- dims & sources tabs */
.page{padding-block:24px 60px;display:grid;gap:34px}
.dimsec{display:grid;gap:12px}
.dimsec > header{display:flex;gap:10px;align-items:center}
.dimsec.i > header{color:var(--int-ink)} .dimsec.a > header{color:var(--act-ink)} .dimsec.o > header{color:var(--out-ink)}
.dimsec > p{color:var(--ink-2);max-width:72ch;font-size:.92rem}
.dimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dim{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.dimsec.i .dim{border-top:3px solid var(--int)} .dimsec.a .dim{border-top:3px solid var(--act)} .dimsec.o .dim{border-top:3px solid var(--out)}
.dim .used{font:500 .66rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sugg{margin-top:10px;padding-top:14px;border-top:1px dashed var(--rule);display:grid;gap:8px}
.sugg .dim{background:var(--surface-2);border-style:dashed;border-top-style:dashed!important;border-top-width:1px!important;border-top-color:var(--rule)!important}
.sugnote{font-size:.85rem;color:var(--ink-3);max-width:72ch}
.refs{display:grid;gap:14px;max-width:900px}
.ref{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:4px}
.ref b{font-weight:600}
.legend{display:grid;gap:8px;max-width:900px;font-size:.9rem;color:var(--ink-2)}

.simgo{justify-self:start;border:1px solid var(--rule);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.simgo:hover{border-color:var(--ink-3);color:var(--ink)}
.simhead{display:grid;gap:6px}.simhead p{color:var(--ink-2);max-width:78ch;font-size:.93rem}
.simgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.simctl{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;display:grid;gap:14px}
.simpick{display:grid;gap:6px}
.simpick > span{display:flex;gap:7px;align-items:center;font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.simpick.i > span{color:var(--int-ink)} .simpick.a > span{color:var(--act-ink)} .simpick.o > span{color:var(--out-ink)}
.simpick svg.ic{width:16px;height:16px}
.simpick select{width:100%;font:inherit;font-size:.9rem;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
.simpick.i select{border-left:3px solid var(--int)} .simpick.a select{border-left:3px solid var(--act)} .simpick.o select{border-left:3px solid var(--out)}
.simnote{font-size:.75rem;color:var(--ink-3)}
.simbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.simplay{border:0;background:var(--ink);color:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer}
.simloop{font-size:.82rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.simstatus{display:grid;gap:4px}
.simtag{font-size:.82rem;padding:8px 10px;border-radius:5px;line-height:1.4}
.simtag.ok{background:var(--int-soft);color:var(--int-ink)} .simtag.team{background:var(--out-soft);color:var(--out-ink)} .simtag.hypo{background:var(--warn-soft);color:var(--warn)}
.simstage{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:grid;gap:10px;min-width:0}
.simstage svg{width:100%;height:auto;display:block}
.simprog{height:3px;background:var(--rule-soft);border-radius:2px;overflow:hidden}.simprog i{display:block;height:100%;width:0;background:var(--ink-3)}
.simsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.simstep{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);transition:all .2s}
.simstep b{font:500 .66rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.simstep svg.ic{width:15px;height:15px}
.simstep.i.on{background:var(--int-soft);color:var(--int-ink);border-color:var(--int)}
.simstep.a.on{background:var(--act-soft);color:var(--act-ink);border-color:var(--act)}
.simstep.o.on{background:var(--out-soft);color:var(--out-ink);border-color:var(--out)}
.simsteps .sep{color:var(--ink-3)}
.simread{margin:0;font-size:.88rem;color:var(--ink-2);background:var(--int-soft);border-radius:5px;padding:8px 12px;line-height:1.45}
.simread b{display:block;font:500 .7rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--int-ink);margin-bottom:2px}
.simread.weak{background:var(--warn-soft)} .simread.weak b{color:var(--warn)}
.simstory{margin:0;font-size:.88rem;color:var(--ink-2);background:var(--out-soft);border-radius:5px;padding:8px 12px}
@media (max-width:900px){ .simgrid{grid-template-columns:1fr} }
@media (max-width:1180px){
  .explorer.withdetail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);max-height:none;border-radius:0;z-index:30;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:29}
}
@media (max-width:760px){
  .colswitch{display:flex}
  .explorer,.explorer.withdetail{grid-template-columns:1fr}
  .col{display:none;max-height:none;min-height:0}
  .col.show{display:flex}
  .list{overflow:visible}
  .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="titlerow">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
    </div>
    <div class="chain" id="chain"></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

const DIMKEYS = {DI1:'mod', DI2:'dev', DI3:'cont', DM1:'where', DM2:'how', DA1:'intent', DA2:'element', DA4:'visref', DA7:'chain'};

/* every dimension of a level, classified or not, in the order of the Dimensions tab */
function dimsOf(t){
  const ds = D.dims.filter(d=>LEVELS[t].includes(d.level) && DIMKEYS[d.id]).map(d=>({
    key: DIMKEYS[d.id] || d.id, name: d.name, classified: !!DIMKEYS[d.id],
    values: DIMKEYS[d.id] ? ORDER[DIMKEYS[d.id]].map(val).join(' · ') : d.values }));
  if(t==='a') ds.push({key:'gesture', name:L().fact, classified:true, values:ORDER.gesture.map(k=>L().gesture[k]).join(' · ')});
  return ds.sort((a,b)=> (b.classified?1:0) - (a.classified?1:0));
}

let D, byI, byA, byO, aiByA, aiByI, amByA, amByO;
function index(){
  D = DATA[lang];
  byI = Object.fromEntries(D.interactions.map(x=>[x.id,x]));
  byA = Object.fromEntries(D.actions.map(x=>[x.id,x]));
  byO = Object.fromEntries(D.outputs.map(x=>[x.id,x]));
  aiByA={}; aiByI={}; amByA={}; amByO={};
  D.ai.forEach(r=>{(aiByA[r.a]=aiByA[r.a]||[]).push(r); (aiByI[r.i]=aiByI[r.i]||[]).push(r);});
  D.am.forEach(r=>{(amByA[r.a]=amByA[r.a]||[]).push(r); (amByO[r.m]=amByO[r.m]||[]).push(r);});
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nsrc = marks => Object.values(marks).filter(v=>v).length;

const val = k => VAL[lang][k] || k;
const locTxt = l => (l||'').replace(/Tab\.\s*1/,L().tab1);

function dimKeys(type, x, d){ const k = dimKey(type, x, d); return Array.isArray(k) ? k : [k]; }
function dimKey(type, x, d){
  if(!d || !d.classified) return 'unclassified';
  const k = d.key;
  if(type==='i') return x.dims[k];
  if(type==='o') return k==='where' ? x.whereKey : x.howKey;
  return k==='gesture' ? (aiByA[x.id] ? 'has' : 'none') : x.dims[k];
}
const dimAt = (t,i) => { const ds = dimsOf(t); return ds[Math.min(i, ds.length-1)]; };
const suggCount = t => D.dims.filter(d=>LEVELS[t].includes(d.level) && !DIMKEYS[d.id]).length;
const groupKey = (type, x) => dimKey(type, x, dimAt(type, st.g[type]));
const orderOf = type => { const d = dimAt(type, st.g[type]); return d.classified ? ORDER[d.key] : ['unclassified']; };
const keyLabel = (type,d,k) => k==='unclassified' ? L().unclass : (d.key==='gesture' ? L().gesture[k] : val(k));

/* ---------------- links for highlighting */
function linked(){
  const s = st.sel, r = {i:{}, a:{}, o:{}};
  if(!s) return null;
  const set = (t,id,lv)=>{ if(!r[t][id] || r[t][id]>lv) r[t][id]=lv; };
  set(s.t, s.id, 0);
  if(s.t==='i'){ (aiByI[s.id]||[]).forEach(x=>{ set('a',x.a,1); (amByA[x.a]||[]).forEach(m=>set('o',m.m,2)); }); }
  if(s.t==='a'){ (aiByA[s.id]||[]).forEach(x=>set('i',x.i,1)); (amByA[s.id]||[]).forEach(m=>set('o',m.m,1)); }
  if(s.t==='o'){ (amByO[s.id]||[]).forEach(m=>{ set('a',m.a,1); (aiByA[m.a]||[]).forEach(x=>set('i',x.i,2)); }); }
  return r;
}

    <div class="link ${t}">${ic('level_'+t)}<div><b>${L()[t+'1']}</b><span>${L()[t+'Desc']}</span></div><span class="num">${n[t]}</span></div>`).join('');
  const noG = D.actions.filter(a=>!aiByA[a.id]).length;
  const zero = D.interactions.filter(i=>nsrc(i.marks)===0).length;
  const ext = D.actions.filter(a=>['register','history','input'].includes(a.dims.intent)).length;
  tabs.innerHTML = Object.entries(L().tabs).map(([k,v])=>`<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${st.tab===k}">${v}</button>`).join('');
}

/* ---------------- explore */
function renderExplore(){
  const lk = linked();
  const q = st.q.trim().toLowerCase();
  const col = (t, items, nameOf, metaOf) => {
    const ds = dimsOf(t), d1 = dimAt(t, st.g[t]), d2 = dimAt(t, st.g2[t]);
    const slider = (which, d, idx) => `<div class="dimslider"><span class="lab2">${which==='g'?L().groupby:L().show}</span>
        <button type="button" class="arw" data-${which}="${t}" data-step="-1" aria-label="${L().prev}">‹</button>
        <span class="dname" title="${esc(d.name)}">${esc(d.name)}</span>
        <button type="button" class="arw" data-${which}="${t}" data-step="1" aria-label="${L().next}">›</button>
        <span class="dots">${ds.map((_,k)=>`<i class="${k===idx?'on':''}${ds[k].classified?'':' un'}"></i>`).join('')}</span></div>`;
    const groups = {};
    items.filter(x=>!q || (nameOf(x)+' '+(x.desc||x.def||'')).toLowerCase().includes(q))
         .forEach(x=>{ dimKeys(t,x,d1).forEach(k=>{ (groups[k]=groups[k]||[]).push(x); }); });
    const body = orderOf(t).filter(k=>groups[k]).map(k=>`<div class="grp"><div class="grp-h">${ic(k==='unclassified'?'none':k)}${esc(keyLabel(t,d1,k))}<span style="margin-left:auto">${groups[k].length}</span></div>
      ${groups[k].map(x=>{ const lv = lk ? lk[t][x.id] : undefined; const cls = lv===0?'sel':lv===1?'l1':lv===2?'l2':'';
        const m = metaOf(x); const ks2 = dimKeys(t,x,d2), k2 = ks2[0], more2 = ks2.length-1;
        return `<button type="button" class="item ${cls}" id="it-${x.id}" data-id2="${k}" data-t="${t}" data-id="${x.id}" aria-pressed="${lv===0}">
          <span class="ico">${ic(k)}</span>
          <span class="txt"><span class="nm">${esc(nameOf(x))}</span>

function whyBlock(x, ev){
  const out = [];
  Object.entries(x.marks).filter(([k,v])=>v).forEach(([k,v])=>{
    const qs = (ev||[]).filter(e=>e.src===k);
    const nm = x.names && x.names[k];
    out.push(`<div class="src ${v}"><span class="who"><b>${SRC[k].s}</b><span class="role">${L().role[v]}</span></span>
      ${nm?`<span class="loc">${L().callsIt}: ${esc(nm)}</span>`:''}
      ${qs.map(e=>`<blockquote>${esc(e.q)}</blockquote><span class="loc">${esc(locTxt(e.loc))}</span>`).join('')}</div>`);
  });
  (ev||[]).filter(e=>e.src==='MTG').forEach(e=> out.push(`<div class="src"><span class="who"><b>${L().mtg}</b> <span class="loc">${esc(e.loc)}</span></span><blockquote>${esc(e.q)}</blockquote></div>`));
  const plain = (ev||[]).filter(e=>!e.src);
  if(!out.length) out.push(`<div class="callout">${esc(plain.map(e=>e.q).join(' '))}</div>`);
  return `<div class="why">${out.join('')}</div>`;
}

  return (s||'').split('·').map(p=>p.trim()).filter(p=>p && p!=='—').map(p=>{
    const m = p.match(/^(YI|GZ|MU|RA|DP)\s*(.*)$/); if(m) return `${SRC[m[1]].s} ${locTxt(m[2])}`.trim();
    if(/^(R17|M17)/.test(p)) return L().mtg; return p; }).join(' · ');

const S_ = {

const LASSO = { cx: 204, cy: 94, rx: 72, ry: 62, a0: -2.2 };

function plan0(a, i){

        s += `<g style="opacity:${ph(0,.2)}">${FING(hx, hy, .35)}</g>`;
        if (t > 0) s += `<line x1="${hx}" y1="${hy}" x2="${lerp(hx, tg.x, t)}" y2="${lerp(hy, tg.y, t)}" style="stroke:var(--int);stroke-width:2;stroke-dasharray:4 4"/>`;
        if (gt > .6) s += `<circle cx="${tg.x}" cy="${tg.y}" r="14" style="fill:none;stroke:var(--int);stroke-width:2;stroke-dasharray:3 3"/>`;
        return s; }
      if (iname === 'place object'){ const t = ease(ph(.1, .7)), x = lerp(590, tg.x + 10, t), y = lerp(20, tg.y - 12, t);
        s += `<rect x="${x-13}" y="${y-9}" width="26" height="26" rx="6" style="fill:var(--ink);opacity:.12"/><rect x="${x-13}" y="${y-13}" width="26" height="26" rx="6" style="fill:var(--int);stroke:var(--int-ink);stroke-width:1.5"/>`;
        return s + (gt > .7 ? RIP(tg.x + 10, tg.y - 12, ph(.7, .95)) : ''); }
      if (iname === 'gaze'){ const ex = 575, ey = 22, t = ph(.1, .75), g = tg.kind === 'none' ? FP() : tg;
        const gx = t < .6 ? lerp(PX + 60, PX + 260, Math.sin(t * 9) * .5 + .5) : g.x, gy = t < .6 ? lerp(PY + 60, PY + 170, Math.cos(t * 7) * .5 + .5) : g.y;
        s += `<g style="opacity:${ph(0,.15)}"><path d="M${ex-14} ${ey}q14-11 28 0q-14 11-28 0z" style="fill:var(--surface);stroke:var(--int-ink);stroke-width:1.4"/><circle cx="${ex}" cy="${ey}" r="3.5" style="fill:var(--int)"/></g><circle cx="${gx}" cy="${gy}" r="7" style="fill:var(--int);opacity:.5"/>`;
        if (gt > .7){ const dt = ph(.7, .95), c = 2*Math.PI*15; s += `<circle cx="${g.x}" cy="${g.y}" r="15" style="fill:none;stroke:var(--int);stroke-width:2.5;stroke-dasharray:${c*dt} ${c}" transform="rotate(-90 ${g.x} ${g.y})"/>`; }
        return s; }
      { const p = approachPath(tg, gt);
        s += RIP(tg.x, tg.y, ph(.5, .72));
        if (iname === 'double-click') s += RIP(tg.x, tg.y, ph(.66, .88));
        if (iname === 'right-click' && gt > .7){
          const ct = ph(.7, .85), mx = Math.min(tg.x + 8, 480), my = Math.min(tg.y + 6, 250), items = [shortName(SIM.a), 'Copy', 'Hide'];
          s += `<g style="opacity:${ct}"><rect x="${mx}" y="${my}" width="104" height="66" rx="4" style="fill:var(--surface);stroke:var(--rule)"/>` +
            items.map((c, k) => `<rect x="${mx+3}" y="${my+3+k*20}" width="98" height="19" rx="3" style="fill:${k===0 && gt>.85 ? 'var(--int-soft)' : 'transparent'}"/><text x="${mx+10}" y="${my+17+k*20}" style="font:11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">${esc(c.length > 14 ? c.slice(0, 13) + '…' : c)}</text>`).join('') + `</g>`;
        }
        return s + CUR(p.x, p.y, gt > .5 && gt < .6 || (iname === 'double-click' && gt > .66 && gt < .74)); }
    case 'drag': case 'brush / lasso': case 'draw': {
      const p0 = approachPath(tg, gt, .35);
      if (gt <= .35) return CUR(p0.x, p0.y, false);
      const t = ease(ph(.38, .92)), N = 30, pts = [];
      for (let k = 0; k <= N * t; k++){
        const u = k / N;
        if (tg.kind === 'region' || tg.kind === 'loop') pts.push([LASSO.cx + LASSO.rx*Math.cos(u*2*Math.PI + LASSO.a0), LASSO.cy + LASSO.ry*Math.sin(u*2*Math.PI + LASSO.a0)]);
        else if (tg.kind === 'sketch') pts.push(drawCurve(u));
        else if (tg.kind === 'line') pts.push([X(.5), lerp(PY + 10, PY + PH - 10, u)]);
        else if (tg.kind === 'rect'){ const r = rubberRect(); pts.push([r.x + r.w * u, r.y + r.h * u]); }
        else pts.push([lerp(tg.x, tg.x2 ?? tg.x + 50, u), lerp(tg.y, tg.y2 ?? tg.y, u)]);
      }
      const cur = pts[pts.length - 1] || [tg.x, tg.y];
      if (tg.kind === 'rect'){ const r = rubberRect(); s += `<rect x="${r.x}" y="${r.y}" width="${(cur[0]-r.x)}" height="${(cur[1]-r.y)}" style="fill:var(--int-soft);fill-opacity:.22;stroke:var(--int);stroke-dasharray:4 3"/>`; }
      else if (pts.length > 1) s += `<polyline points="${pts.map(q => q.join(',')).join(' ')}" style="fill:${(tg.kind==='region'||tg.kind==='loop') && t > .95 ? 'var(--int-soft)' : 'none'};fill-opacity:.22;stroke:var(--int);stroke-width:${iname==='draw'?3:2};${tg.kind==='drop'||tg.kind==='slider'||tg.kind==='scrollbar'?'stroke-dasharray:4 3;':''}opacity:.9"/>`;
      if (P.variant === 'file') s += `<g transform="translate(${cur[0]-12} ${cur[1]-16})"><path d="M0 0h16l6 6v20H0z" style="fill:var(--surface);stroke:var(--int-ink);stroke-width:1.4"/><text x="3" y="20" style="font:7px 'IBM Plex Mono',monospace;fill:var(--int-ink)">csv</text></g>`;
      if (P.variant === 'shelf') s += `<rect x="${cur[0]-26}" y="${cur[1]-10}" width="52" height="20" rx="10" style="fill:var(--int-soft);stroke:var(--int)"/><text x="${cur[0]}" y="${cur[1]+4}" text-anchor="middle" style="font:10px 'IBM Plex Mono',monospace;fill:var(--int-ink)">price</text>`;
      return s + CUR(cur[0], cur[1], true); }
    case 'key': {
      const k = KEYS[SIM.a] || '↵', pressed = gt > .55 && gt < .72, w = 18 + k.length * 9;
      const x = PX + PW/2 - w/2, y = 250 + (pressed ? 3 : 0);
      return `<g style="opacity:${ph(.05,.25)}"><rect x="${x}" y="${y}" width="${w}" height="30" rx="5" style="fill:var(--surface);stroke:var(--int-ink);stroke-width:1.5"/>
        <rect x="${x}" y="${y+26}" width="${w}" height="4" rx="2" style="fill:var(--int);opacity:${pressed ? 0 : .5}"/>
        <text x="${x+w/2}" y="${y+20}" text-anchor="middle" style="font:600 13px 'IBM Plex Mono',monospace;fill:var(--int-ink)">${esc(k)}</text></g>`; }
    case 'type': { const p = approachPath(tg, gt, .3); return CUR(p.x, p.y, gt > .3 && gt < .36); }
    case 'pinch': {
      const t = ease(ph(.3, .9)), d = lerp(10, 58, t);
      s += `<g style="opacity:${ph(0, .25)}">${FING(tg.x - d, tg.y + d*.5, .4)}${FING(tg.x + d, tg.y - d*.5, .4)}</g>`;
      if (t > 0) s += `<line x1="${tg.x-d}" y1="${tg.y+d*.5}" x2="${tg.x+d}" y2="${tg.y-d*.5}" style="stroke:var(--int);stroke-dasharray:3 3;opacity:.6"/>`;
      return s; }
    case 'scroll': {
      const x = tg.x + 26, y = tg.y - 10, o = (gt * 6) % 1;
      return `<g style="opacity:${ph(0,.2)}"><rect x="${x}" y="${y}" width="22" height="34" rx="11" style="fill:var(--surface);stroke:var(--int-ink);stroke-width:1.4"/>
        <line x1="${x+11}" y1="${y+6}" x2="${x+11}" y2="${y+13}" style="stroke:var(--int);stroke-width:3;stroke-linecap:round"/>
        <path d="M${x+11} ${y-6-8*o}l-4 5h8z" style="fill:var(--int);opacity:${gt>.3?1-o:0}"/></g>`; }
    case 'voice': {
      const txt = `“${txtFor(SIM.a)}”`, n = Math.round(txt.length * ph(.2, .8)), bx = PX + 60, by = 4;
      return `<g style="opacity:${ph(0,.15)}"><rect x="${bx}" y="${by}" width="${Math.max(120, txt.length * 7.2 + 24)}" height="24" rx="12" style="fill:var(--int-soft);stroke:var(--int)"/>
        <text x="${bx+12}" y="${by+16}" style="font:12px 'IBM Plex Sans',sans-serif;fill:var(--int-ink)">${esc(txt.slice(0, n))}</text></g>` +
        [0,1,2,3,4].map(k => { const h = 4 + 7*Math.abs(Math.sin(gt*14 + k)); return `<rect x="${PX + 14 + k*6}" y="${by + 12 - h}" width="3" height="${2*h}" rx="1.5" style="fill:var(--int);opacity:${gt < .85 ? 1 : 0}"/>`; }).join(''); }
    case 'body / head': case 'approach': {
      const t = ease(ph(.1, .8)), sc = iname === 'approach' ? lerp(.55, 1.25, t) : 1, lean = iname === 'body / head' ? Math.sin(t * Math.PI) * 18 : 0;
      return `<g transform="translate(540 250) scale(${sc}) rotate(${lean})" style="opacity:${ph(0,.15)}">
        <circle cx="0" cy="-58" r="10" style="fill:var(--int-soft);stroke:var(--int-ink);stroke-width:1.5"/>
        <path d="M0 -48v34M-16 -34h32M0 -14l-11 22M0 -14l11 22" style="fill:none;stroke:var(--int-ink);stroke-width:2;stroke-linecap:round"/></g>`; }
  }
  return s;
}

/* ---------- one frame ---------- */
function frame(time){
  const P = plan(SIM.a, SIM.i);
  const tg0 = DUR.g, ta0 = tg0 + DUR.a, te1 = ta0 + DUR.e;
  const gt = clamp(time / tg0);
  /* continuous interactions drive the output during the interaction; discrete ones trigger it afterwards */
  const liveStart = .38 * tg0;
  const at = P.live ? clamp((time - liveStart) / DUR.a) : clamp((time - tg0) / DUR.a);
  const et = P.live ? clamp((time - liveStart) / (tg0 - liveStart)) : clamp((time - ta0) / DUR.e);
  const fade = P.transient ? clamp(1 - (time - (te1 + .2)) / .5) : 1;
  const o = effect(SIM.m, SIM.a, P, et, fade);
  const act = byA[SIM.a].name, badgeEnd = P.live ? tg0 + .8 : te1;
  const badge = at > 0 ? `<g style="opacity:${time < badgeEnd ? Math.min(1, at*2) : clamp(1 - (time - badgeEnd) / .4)}">
      <rect x="${PX + PW/2 - (act.length*4 + 26)}" y="${PY + 8}" width="${act.length*8 + 52}" height="26" rx="13" style="fill:var(--act)"/>
      <text x="${PX + PW/2}" y="${PY + 25}" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:#fff">${esc(act)}</text></g>` : '';
  const gOp = time < tg0 ? 1 : .25 + .75 * clamp(1 - (time - tg0) / 1.2);
  const svg = document.getElementById('stage');
  if (svg) svg.innerHTML = plotSVG(o) + panelSVG(o, P, gt, time) + stripSVG(o) + badge + `<g style="opacity:${gOp}">${interaction(byI[SIM.i].name, gt, P)}</g>`;
  const phase = P.live ? (time < liveStart ? 1 : time < tg0 ? 2 : 3) : (time < tg0 ? 1 : time < ta0 ? 2 : 3);
  document.querySelectorAll('.simstep').forEach((el, k) => el.classList.toggle('on', P.live && time >= liveStart && time < tg0 ? k < 3 : k + 1 === phase));
  const bar = document.getElementById('simbar'); if (bar) bar.style.width = (100 * time / TOTAL) + '%';
}
function tick(now){
  if (!SIM.playing) return;
  const dt = SIM.last ? (now - SIM.last) / 1000 : 0; SIM.last = now;
  SIM.t += dt;
  if (SIM.t >= TOTAL){ if (SIM.loop) SIM.t = 0; else { SIM.t = TOTAL; SIM.playing = false; updPlay(); } }
  frame(SIM.t);
  if (SIM.playing) SIM.raf = requestAnimationFrame(tick);
}
function play(){ if (SIM.t >= TOTAL) SIM.t = 0; SIM.playing = true; SIM.last = 0; updPlay(); cancelAnimationFrame(SIM.raf); SIM.raf = requestAnimationFrame(tick); }
function pause(){ SIM.playing = false; cancelAnimationFrame(SIM.raf); updPlay(); }
function updPlay(){ const b = document.getElementById('simplay'); if (b) b.innerHTML = (SIM.playing ? '❚❚ ' + S_.pause : '▶ ' + S_.play); }

/* ---------- controls ---------- */
function simDefaults(){
  if (!SIM.a || !byA[SIM.a]) SIM.a = (D.actions.find(a => a.name === 'Filter') || D.actions[0]).id;
  const rels = aiByA[SIM.a] || [];
  if (!SIM.i || !byI[SIM.i]) SIM.i = rels.length ? rels[0].i : (D.interactions.find(x => x.name === (STORIES[SIM.a] ? 'key' : 'click')) || D.interactions[0]).id;
  const mods = (amByA[SIM.a] || []).map(r => r.m);
  if (!SIM.m || !mods.includes(SIM.m)) SIM.m = mods[0];
}
function simStatus(){
  const r = relFor(SIM.a, SIM.i);
  if (!r) return `<span class="simtag hypo">${S_.hypo}</span>`;
  if (r.origin === 'T') return `<span class="simtag team">${S_.team}</span>`;
  return `<span class="simtag ok">${S_.described(r.impl, srcLabel(r.src))}</span>`;
}
function renderSim(){
  simDefaults();
  const described = new Set((aiByA[SIM.a] || []).map(r => r.i));
  const iOpts = ORDER.mod.map(g => {
    const items = D.interactions.filter(x => x.dims.mod === g);
    return items.length ? `<optgroup label="${esc(val(g))}">${items.map(x => `<option value="${x.id}" ${x.id === SIM.i ? 'selected' : ''}>${described.has(x.id) ? '● ' : '○ '}${esc(x.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  const aOpts = ORDER.intent.map(g => {
    const items = D.actions.filter(x => x.dims.intent === g);
    return items.length ? `<optgroup label="${esc(val(g))}">${items.map(x => `<option value="${x.id}" ${x.id === SIM.a ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  const mOpts = (amByA[SIM.a] || []).map(r => `<option value="${r.m}" ${r.m === SIM.m ? 'selected' : ''}>${esc(byO[r.m].name)}</option>`).join('');
  const P = plan(SIM.a, SIM.i), story = S_.story[SIM.a];
  main.innerHTML = `<div class="wrap page sim">
    <section class="simhead"><h2>${S_.title}</h2><p>${S_.lead}</p></section>
    <div class="simgrid">
      <div class="simctl">
        <label class="simpick i"><span>${ic('level_i')}${S_.pickI}</span><select id="sim-i">${iOpts}</select></label>
        <label class="simpick a"><span>${ic('level_a')}${S_.pickA}</span><select id="sim-a">${aOpts}</select></label>
        <label class="simpick o"><span>${ic('level_o')}${S_.pickM}</span><select id="sim-m">${mOpts}</select></label>
        <p class="simnote">${S_.dot}</p>
        <div class="simbtns"><button type="button" id="simplay" class="simplay"></button>
          <label class="simloop"><input type="checkbox" id="simloop" ${SIM.loop ? 'checked' : ''}> ${S_.loop}</label></div>
        <button type="button" id="simrand" class="clear">${S_.random}</button>
        <div class="simstatus">${simStatus()}<span class="loc">${S_.onw[P.surface] || ''} · ${S_.roleLab[P.role]}${P.live ? ' · continuous' : ''}</span></div>
      </div>
      <figure class="simstage">
        <svg id="stage" viewBox="0 0 600 345" role="img" aria-label="${esc(S_.title)}"></svg>
        <div class="simprog"><i id="simbar"></i></div>
        <div class="simsteps">
          <span class="simstep i">${ic(byI[SIM.i].dims.mod)}<b>${S_.step1}</b> ${esc(byI[SIM.i].name)}</span><span class="sep">→</span>
          <span class="simstep a">${ic(byA[SIM.a].dims.intent)}<b>${S_.step2}</b> ${esc(byA[SIM.a].name)}</span><span class="sep">→</span>
          <span class="simstep o">${ic(byO[SIM.m].whereKey)}<b>${S_.step3}</b> ${esc(byO[SIM.m].name)}</span>
        </div>
        <p class="simread ${P.weak ? 'weak' : ''}"><b>${S_.reading}${P.weak ? ` · ${S_.weak}` : ''}</b>${esc(P.reading)}</p>
        ${story ? `<p class="simstory">${esc(story)}</p>` : ''}
      </figure>
    </div></div>`;
  backdrop.classList.remove('on');
  updPlay();
  frame(SIM.t || 0);
  const onSel = (id, fn) => document.getElementById(id).addEventListener('change', e => { fn(e.target.value); SIM.t = 0; renderSim(); play(); });
  onSel('sim-i', v => { SIM.i = v; });
  onSel('sim-a', v => { SIM.a = v; SIM.m = null; const r = aiByA[v]; if (r && !r.some(x => x.i === SIM.i)) SIM.i = r[0].i; });
  onSel('sim-m', v => { SIM.m = v; });
  document.getElementById('simplay').onclick = () => SIM.playing ? pause() : play();
  document.getElementById('simloop').onchange = e => { SIM.loop = e.target.checked; };
  document.getElementById('simrand').onclick = () => { const pool = D.ai.filter(x => x.origin !== 'T'), r = pool[Math.floor(Math.random() * pool.length)]; SIM.a = r.a; SIM.i = r.i; SIM.m = null; SIM.t = 0; renderSim(); play(); };
}
function openSim(t, id){
  pause(); SIM.t = 0;
  if (t === 'a'){ SIM.a = id; SIM.i = null; SIM.m = null; }
  if (t === 'i'){ const r = (aiByI[id] || [])[0]; SIM.i = id; SIM.a = r ? r.a : (SIM.a || D.actions[0].id); SIM.m = null; }
  if (t === 'o'){ const r = (amByO[id] || [])[0]; SIM.a = r.a; SIM.m = id; SIM.i = null; }
  st.tab = 'sim'; render(); play();
}

/* ---------------- render + events */
function render(){
  index(); renderHeader();
  if(st.tab!=='sim' && typeof pause==='function') pause();
  if(st.tab==='explore') renderExplore(); else if(st.tab==='sim') renderSim(); else if(st.tab==='dims') renderDims(); else renderSources();
}
function select(t,id){
  st.sel = (st.sel && st.sel.t===t && st.sel.id===id) ? null : {t,id};
  if(st.sel) st.col = t;
  renderExplore();
  const d = document.getElementById('detail'); if(d) d.scrollTop = 0;
  if(st.sel){ const el = document.querySelector('[id="it-'+id+'"]'); if(el && window.innerWidth>760) el.scrollIntoView({block:'nearest'}); }
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-lang]');
  if(e.target.id==='backdrop'){ st.sel=null; renderExplore(); return; }
  if(!b) return;
  if(b.dataset.tab){ st.tab = b.dataset.tab; render(); if(st.tab==='sim'){ SIM.t=0; play(); } return; }
  if(b.dataset.g || b.dataset.g2){
    const which = b.dataset.g ? 'g' : 'g2', t = b.dataset.g || b.dataset.g2, n = dimsOf(t).length;
    st[which][t] = (st[which][t] + Number(b.dataset.step) + n) % n;
    if(st.g[t] === st.g2[t]) st.g2[t] = (st.g2[t] + 1) % n;
    renderExplore(); return; }
  if(b.dataset.col){ st.col = b.dataset.col; renderExplore(); return; }
  if(b.dataset.simt){ openSim(b.dataset.simt, b.dataset.simid); return; }
  if(b.id==='clear' || b.id==='close'){ st.sel = null; renderExplore(); return; }
  if(b.dataset.t && b.dataset.id){ if(st.tab!=='explore'){ st.tab='explore'; render(); } select(b.dataset.t, b.dataset.id); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && st.sel){ st.sel=null; renderExplore(); } });
window.addEventListener('resize', ()=>backdrop.classList.toggle('on', !!st.sel && st.tab==='explore' && window.innerWidth<=1180));

index();
if(window.innerWidth>1180){ const f = D.actions.find(a=>a.name==='Filter'); if(f) st.sel = {t:'a', id:f.id}; }
render();
})();
</script>
