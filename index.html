<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Espaço de Interações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F2F6; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --ink:#161821; --ink-2:#4A4F5E; --ink-3:#777D8E;
  --rule:#DADDE6; --rule-soft:#E8EAF0;
  --int:#1F7A68; --int-soft:#E3F2EE; --int-ink:#17614F;
  --act:#3B4CC0; --act-soft:#E9ECFA; --act-ink:#2E3C9E;
  --out:#A5690A; --out-soft:#FAF0DC; --out-ink:#7F5006;
  --warn:#B40426; --warn-soft:#FAEBEE;
  --shadow:0 10px 30px rgba(22,24,33,.12);
  --p0:#8A7CC2; --p1:#D07A8C; --p2:#6C8FB3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1016; --surface:#161922; --surface-2:#1B1F29;
    --ink:#E8EAF1; --ink-2:#A8AEBE; --ink-3:#7C8396;
    --rule:#2A2F3C; --rule-soft:#222733;
    --int:#5CC2A8; --int-soft:#13271F; --int-ink:#7FD6BF;
    --act:#8B99EE; --act-soft:#1C2135; --act-ink:#A3AEF3;
    --out:#E3B462; --out-soft:#2A2213; --out-ink:#EDC57F;
    --warn:#EC8195; --warn-soft:#2C1A20;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --p0:#A99DDB; --p1:#E394A3; --p2:#8FB0D0;
  }
}
:root[data-theme="dark"]{
  --p0:#A99DDB; --p1:#E394A3; --p2:#8FB0D0;
  --paper:#0E1016; --surface:#161922; --surface-2:#1B1F29;
  --ink:#E8EAF1; --ink-2:#A8AEBE; --ink-3:#7C8396;
  --rule:#2A2F3C; --rule-soft:#222733;
  --int:#5CC2A8; --int-soft:#13271F; --int-ink:#7FD6BF;
  --act:#8B99EE; --act-soft:#1C2135; --act-ink:#A3AEF3;
  --out:#E3B462; --out-soft:#2A2213; --out-ink:#EDC57F;
  --warn:#EC8195; --warn-soft:#2C1A20;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-inline:20px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:Spectral,Georgia,serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,2.5rem);letter-spacing:-.015em}
h2{font-family:Spectral,Georgia,serif;font-weight:600;font-size:1.45rem}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.code{font:600 .72em "IBM Plex Mono",ui-monospace,monospace;color:var(--ink-3);margin-right:.45em;letter-spacing:.02em;white-space:nowrap}
.dhead h2 .code{font-size:.7em;vertical-align:.12em}
.lab{font:500 .68rem "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header */
header.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top-inner{display:grid;gap:18px;padding-block:28px 0}
.titlerow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--ink-2);max-width:70ch;margin-top:6px}
.langs{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:5px 12px;font:500 .78rem "IBM Plex Mono",monospace;cursor:pointer;color:var(--ink-3)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.link{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:6px;min-width:0;flex:1 1 200px}
.link b{display:block;font-size:.95rem}
.link span{display:block;font-size:.82rem;color:var(--ink-2)}
.link .num{font:500 1.35rem Spectral,serif;margin-left:auto;padding-left:8px}
.link.i{background:var(--int-soft);color:var(--int-ink)} .link.a{background:var(--act-soft);color:var(--act-ink)} .link.o{background:var(--out-soft);color:var(--out-ink)}
.link svg.ic{width:26px;height:26px}
.arrow{align-self:center;color:var(--ink-3);font-size:1.2rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.84rem;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:4px;margin-top:4px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--ink-3);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

/* ---------- toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:16px}
.search{flex:1 1 240px;min-width:0;max-width:420px;padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.selpath{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--ink-2)}
.clear{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.colswitch{display:none;gap:4px;width:100%}
.colswitch button{flex:1;border:1px solid var(--rule);background:var(--surface);padding:7px;border-radius:4px;font-size:.85rem;cursor:pointer}
.colswitch button[aria-pressed="true"].i{background:var(--int);color:#fff;border-color:var(--int)}
.colswitch button[aria-pressed="true"].a{background:var(--act);color:#fff;border-color:var(--act)}
.colswitch button[aria-pressed="true"].o{background:var(--out);color:#fff;border-color:var(--out)}

/* ---------- explorer */
.explorer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:40px;align-items:start}
.explorer.withdetail{grid-template-columns:repeat(3,minmax(0,1fr)) 420px}
.col{background:var(--surface);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 150px);min-height:480px}
.colhead{padding:14px 14px 10px;border-bottom:1px solid var(--rule-soft);display:grid;gap:8px;min-width:0}
.colhead > *{min-width:0}
.colhead .t{display:flex;gap:9px;align-items:center}
.colhead h2{font-size:1.2rem}
.colhead .cnt{margin-left:auto;font:.78rem "IBM Plex Mono",monospace;color:var(--ink-3)}
.col.i .colhead .t{color:var(--int-ink)} .col.a .colhead .t{color:var(--act-ink)} .col.o .colhead .t{color:var(--out-ink)}
.col.i{border-top:3px solid var(--int)} .col.a{border-top:3px solid var(--act)} .col.o{border-top:3px solid var(--out)}
.groupby{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.76rem;color:var(--ink-3)}
.groupby button{border:1px solid var(--rule);background:none;border-radius:999px;padding:2px 9px;cursor:pointer;font-size:.76rem;color:var(--ink-2)}
.groupby button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{overflow-y:auto;padding:6px 8px 12px;flex:1}
.grp{margin-top:8px}
.grp-h{display:flex;gap:7px;align-items:center;padding:6px 6px 4px;font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grp-h svg.ic{width:15px;height:15px}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:5px;padding:7px 8px;cursor:pointer;transition:opacity .15s,background .15s}
.item:hover{background:var(--surface-2)}
.item .ico{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;flex:none}
.col.i .ico{background:var(--int-soft);color:var(--int)} .col.a .ico{background:var(--act-soft);color:var(--act)} .col.o .ico{background:var(--out-soft);color:var(--out)}
.item .txt{flex:1;min-width:0;display:grid;gap:2px}
.item .nm{min-width:0;font-size:.93rem;line-height:1.3}
.item .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .d2{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;color:var(--ink-3)}
.item .d2 svg.ic{width:13px;height:13px}
.dimslider{display:flex;align-items:center;gap:6px;font-size:.78rem;min-width:0}
.dimslider .lab2{font:500 .62rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);width:52px;flex:none;line-height:1.15}
.dimslider .arw{border:1px solid var(--rule);background:var(--surface);border-radius:4px;width:22px;height:22px;line-height:1;cursor:pointer;color:var(--ink-2);flex:none;padding:0}
.dimslider .arw:hover{border-color:var(--ink-3)}
.dimslider .dname{flex:1;min-width:0;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dimslider .dots{display:flex;gap:3px;flex:none}
.dimslider .dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dimslider .dots i.un{background:none;border:1px solid var(--rule)}
.dimslider .dots i.on{background:var(--ink-3)}
.dvals{font-size:.72rem;color:var(--ink-3);line-height:1.4}
.dvals b{color:var(--warn);font-weight:500}
.item .d2 .k{color:var(--ink-3)}
.col.i .item .nm{font-family:"IBM Plex Mono",monospace;font-size:.88rem}
.item .meta{margin-left:auto}
.item .meta{font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.item .meta.gap{color:var(--warn)}
.list.hasSel .item{opacity:.3}
.list.hasSel .item.l1,.list.hasSel .item.l2,.list.hasSel .item.sel{opacity:1}
.col.i .item.l1{background:var(--int-soft)} .col.a .item.l1{background:var(--act-soft)} .col.o .item.l1{background:var(--out-soft)}
.item.l2{border-style:dashed;border-color:var(--rule)}
.col.i .item.sel{border-color:var(--int);background:var(--int-soft)} .col.a .item.sel{border-color:var(--act);background:var(--act-soft)} .col.o .item.sel{border-color:var(--out);background:var(--out-soft)}
.item.sel .ico{color:#fff} .col.i .item.sel .ico{background:var(--int)} .col.a .item.sel .ico{background:var(--act)} .col.o .item.sel .ico{background:var(--out)}
.empty{padding:20px;color:var(--ink-3);font-size:.85rem;text-align:center}

/* ---------- detail */
.detail{background:var(--surface);border:1px solid var(--rule);border-radius:6px;max-height:calc(100vh - 150px);overflow-y:auto;position:sticky;top:12px}
.detail[hidden]{display:none}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--rule-soft);display:grid;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .row{display:flex;gap:10px;align-items:center}
.dhead .ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.dhead .ico svg.ic{width:22px;height:22px}
.dhead h2{font-size:1.4rem}
.dhead h2.mono{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:1.25rem}
.x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:1.3rem;line-height:1;padding:4px 6px}
.dbody{padding:16px 20px 24px;display:grid;gap:22px}
.dbody section{display:grid;gap:8px}
.lead{font-size:.95rem;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px 3px 7px;border-radius:999px;font-size:.8rem;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink-2)}
.chip svg.ic{width:15px;height:15px}
.chip .k{color:var(--ink-3)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink-3)}
.chip.i{background:var(--int-soft);color:var(--int-ink);border-color:transparent;font-family:"IBM Plex Mono",monospace}
.chip.a{background:var(--act-soft);color:var(--act-ink);border-color:transparent}
.chip.o{background:var(--out-soft);color:var(--out-ink);border-color:transparent}
.why{display:grid;gap:10px}
.src{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--rule)}
.src.D{border-color:var(--ink-2)} .src.X{border-color:var(--warn)}
.src .who{font-size:.84rem;color:var(--ink)} .src .who b{font-weight:600}
.src .who .role{font:500 .68rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.src.X .role{color:var(--warn)}
blockquote{margin:0;font:italic .95rem/1.5 Spectral,Georgia,serif;color:var(--ink);overflow-wrap:anywhere}
.loc{font:.72rem "IBM Plex Mono",monospace;color:var(--ink-3)}
.callout{padding:10px 12px;border-radius:5px;background:var(--warn-soft);color:var(--ink);font-size:.86rem}
.note{font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:10px 12px}
.impl{border:1px solid var(--rule-soft);border-radius:6px;padding:10px 12px;display:grid;gap:7px}
.impl .ih{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.impl .ih b{font-weight:600}
.surf{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;color:var(--ink-3);margin-left:auto}
.surf svg.ic{width:14px;height:14px}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seq .sep{color:var(--ink-3);font-size:.8rem}
.orig{font-size:.74rem;color:var(--ink-3)}
.orig.T{color:var(--warn)}
.prod{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--rule-soft)}
.prod:first-of-type{border-top:0}
.backdrop{display:none}

/* ---------- dims & sources tabs */
.page{padding-block:24px 60px;display:grid;gap:34px}
.dimsec{display:grid;gap:12px}
.dimsec > header{display:flex;gap:10px;align-items:center}
.dimsec.i > header{color:var(--int-ink)} .dimsec.a > header{color:var(--act-ink)} .dimsec.o > header{color:var(--out-ink)}
.dimsec > p{color:var(--ink-2);max-width:72ch;font-size:.92rem}
.dimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dim{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.dimsec.i .dim{border-top:3px solid var(--int)} .dimsec.a .dim{border-top:3px solid var(--act)} .dimsec.o .dim{border-top:3px solid var(--out)}
.dim .used{font:500 .66rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sugg{margin-top:10px;padding-top:14px;border-top:1px dashed var(--rule);display:grid;gap:8px}
.sugg .dim{background:var(--surface-2);border-style:dashed;border-top-style:dashed!important;border-top-width:1px!important;border-top-color:var(--rule)!important}
.sugnote{font-size:.85rem;color:var(--ink-3);max-width:72ch}
.refs{display:grid;gap:14px;max-width:900px}
.ref{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:4px}
.ref b{font-weight:600}
.legend{display:grid;gap:8px;max-width:900px;font-size:.9rem;color:var(--ink-2)}

.simgo{justify-self:start;border:1px solid var(--rule);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.simgo:hover{border-color:var(--ink-3);color:var(--ink)}
.simhead{display:grid;gap:6px}.simhead p{color:var(--ink-2);max-width:78ch;font-size:.93rem}
.simgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.simctl{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px;display:grid;gap:14px}
.simpick{display:grid;gap:6px}
.simpick > span{display:flex;gap:7px;align-items:center;font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.simpick.i > span{color:var(--int-ink)} .simpick.a > span{color:var(--act-ink)} .simpick.o > span{color:var(--out-ink)}
.simpick svg.ic{width:16px;height:16px}
.simpick select{width:100%;font:inherit;font-size:.9rem;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
.simpick.i select{border-left:3px solid var(--int)} .simpick.a select{border-left:3px solid var(--act)} .simpick.o select{border-left:3px solid var(--out)}
.simnote{font-size:.75rem;color:var(--ink-3)}
.simbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.simplay{border:0;background:var(--ink);color:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600;cursor:pointer}
.simloop{font-size:.82rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.simstatus{display:grid;gap:4px}
.simtag{font-size:.82rem;padding:8px 10px;border-radius:5px;line-height:1.4}
.simtag.ok{background:var(--int-soft);color:var(--int-ink)} .simtag.team{background:var(--out-soft);color:var(--out-ink)} .simtag.hypo{background:var(--warn-soft);color:var(--warn)}
.simstage{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:grid;gap:10px;min-width:0}
.simstage svg{width:100%;height:auto;display:block}
.simprog{height:3px;background:var(--rule-soft);border-radius:2px;overflow:hidden}.simprog i{display:block;height:100%;width:0;background:var(--ink-3)}
.simsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.simstep{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);transition:all .2s}
.simstep b{font:500 .66rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.simstep svg.ic{width:15px;height:15px}
.simstep.i.on{background:var(--int-soft);color:var(--int-ink);border-color:var(--int)}
.simstep.a.on{background:var(--act-soft);color:var(--act-ink);border-color:var(--act)}
.simstep.o.on{background:var(--out-soft);color:var(--out-ink);border-color:var(--out)}
.simsteps .sep{color:var(--ink-3)}
.simread{margin:0;font-size:.88rem;color:var(--ink-2);background:var(--int-soft);border-radius:5px;padding:8px 12px;line-height:1.45}
.simread b{display:block;font:500 .7rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--int-ink);margin-bottom:2px}
.simread.weak{background:var(--warn-soft)} .simread.weak b{color:var(--warn)}
.simstory{margin:0;font-size:.88rem;color:var(--ink-2);background:var(--out-soft);border-radius:5px;padding:8px 12px}
@media (max-width:900px){ .simgrid{grid-template-columns:1fr} }
@media (max-width:1180px){
  .explorer.withdetail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);max-height:none;border-radius:0;z-index:30;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:29}
}
@media (max-width:760px){
  .colswitch{display:flex}
  .explorer,.explorer.withdetail{grid-template-columns:1fr}
  .col{display:none;max-height:none;min-height:0}
  .col.show{display:flex}
  .list{overflow:visible}
  .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- statistics tab */
.stats{gap:22px}
.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stile{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;display:grid;gap:2px}
.stile b{font:600 1.9rem/1.1 "IBM Plex Sans",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}

"M18", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A33", "m": "M19", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A34", "m": "M21", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A35", "m": "M20", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A36", "m": "M20", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A37", "m": "M20", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A38", "m": "M20", "origin": "D", "src": "DP §6.1", "note": ""}, {"a": "A39", "m": "M22", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A39", "m": "M23", "origin": "L", "src": "GZ Tab. 1", "note": "“Removes the most recently performed action from a user’s sequence of actions.”"}, {"a": "A40", "m": "M22", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A40", "m": "M23", "origin": "D", "src": "GZ Tab. 1", "note": ""}, {"a": "A41", "m": "M22", "origin": "T", "src": "—", "note": "Reset appears only as an item YI excludes."}, {"a": "A42", "m": "M23", "origin": "L", "src": "GZ Tab. 1", "note": "“removes an action from the middle of a user’s sequence”."}, {"a": "A43", "m": "M23", "origin": "D", "src": "GZ Tab. 1", "note": "Changes a past step and re-runs from there."}, {"a": "A44", "m": "M22", "origin": "D", "src": "GZ Tab. 1", "note": "“A request to return to an earlier stage of analysis.”"}], "dims": [{"id": "DI1", "level": "Interaction", "name": "Human modality", "values": "hand; voice; gaze; head / body", "origin": "L", "q": "DP §6.2: “An interaction means can be characterized according to its cardinality, human modality, and technology modality.”", "note": "Cardinality is not a property of the interaction: it moved to the relation."}, {"id": "DI2", "level": "Interaction", "name": "Technology modality (device)", "values": "mouse; keyboard; touch screen; pen; tangible object; microphone; eye tracker; body / proximity sensor", "origin": "L", "q": "DP §6.2 (same passage) · MU §11.4.1: “With a mouse, clicks and hovers are easy to get […] If there is also a keyboard, then key presses can be added”", "note": ""}, {"id": "DI3", "level": "Interaction", "name": "Interaction continuity", "values": "discrete; continuous", "origin": "L", "q": "DP §3.1.3: “Continuous interactions involve a sequence of intermediate visualization states […] With discrete interactions, action and reaction occur in a distinct manner”", "note": "DP notes that action and reaction may differ in continuity; reaction continuity was removed on 2026-09-25 because papers almost never describe it."}, {"id": "DI4", "level": "Interaction", "name": "Weight", "values": "lightweight; heavyweight", "origin": "D", "q": "MU §10.4.5: “lightweight actions such as mouseover or clicking, as opposed to more heavyweight actions such as using search, where a text string is typed into a control panel” · MU §12.5: “the division is often a very lightweight choice driven by the user’s changing selection”", "note": "Weight = the effort of formulating the input (2026-09-25). Lightweight: the user only points or moves (click, hover, drag, trace, touch, scroll…). Heavyweight: the user composes content before the system acts (typing, voice). Recorded per occurrence: a trace whose drawing is itself the query content is heavyweight."}, {"id": "DA1", "level": "Action", "name": "User intent", "values": "select; explore; reconfigure; encode; abstract/elaborate; filter; connect  +  register* (extension)", "origin": "L", "q": "YI §4: “Based on the notion of user intent, the following seven categories of interaction in Infovis emerged”", "note": "Register* is our extension. Zoom as Explore departs from YI."}, {"id": "DA2", "level": "Action", "name": "Element type (selection target)", "values": "item; attribute; link; attribute level; view  +  extensions: dataset*; note*; history action*; encoding*; parameter*; interface setting*", "origin": "L", "q": "MU §11.4.1: “A fundamental design choice with selection is what kinds of elements can be selection targets.”", "note": "Extensions are ours. parameter* = a value that controls a computation (model, algorithm or query parameter). interface setting* = a setting of the interface itself (mode, coordination between views, playback, available interactions)."}, {"id": "DA3", "level": "Action", "name": "Agent (who holds the intent)", "values": "end user; designer  +  autonomous agent (proposed extension)", "origin": "L", "q": "MU §3.3: “indicating who has a goal or makes a design choice: the designer of the vis or the end user of the vis” · DP §5.2: “the beholder of the intent be the designer”", "note": "The third value is the LLM extension."}, {"id": "DA4", "level": "Action", "name": "Visual object reference", "values": "references an on-screen object; does not", "origin": "D", "q": "GZ §5.3: separates visual insight from knowledge insight by whether they reference visualization objects", "note": ""}, {"id": "DA5", "level": "Action", "name": "Intent cardinality", "values": "single intent; multiple intents", "origin": "D", "q": "YI §5: “Some other interaction techniques appear to fulfill multiple user intents”", "note": ""}, {"id": "DA6", "level": "Action", "name": "Intent presence", "values": "explicit; implicit", "origin": "D", "q": "DP §5.2: “include implicit interaction [61] and coarsely approximated intent”", "note": ""}, {"id": "DA7", "level": "Action", "name": "Position in the chain", "values": "feeds another action; auto feed* (extension); terminal", "origin": "D", "q": "MU §11.4: “The output of a selection operation is often the input to a subsequent operation.”", "note": "Feeds another action: the output is the input of another operation. Auto feed* (our extension): the action is neither terminal nor feeds another operation — its output feeds back into the same view (e.g., a filter that changes its own view; a widget is in the same position of the chain as the chart it controls). Terminal: the output ends there. Only actions whose output is by definition the input of another one have a fixed value (A28, A34, A35); for the others the value depends on where the effect shows."}, {"id": "DM1", "level": "Modification", "name": "Where it changes (target)", "values": "data; mapping; navigation; arrangement; highlight / focus; style; notes; history", "origin": "D", "q": "GZ §5.2: “(1) data change, (2) visual change, (3) notes change, and (4) history change” · DP §6.1 · RA §4.1", "note": "Was the action-level D02. Moved to this level on 2026-09-21."}, {"id": "DM2", "level": "Modification", "name": "How it changes", "values": "adds; removes; alters; reorders; repositions; rescales; translates; rotates; switches; aggregates / disaggregates; marks; highlights; reveals; records; restores", "origin": "D", "q": "MU §11.3: “change the encoding, change the arrangement, change the order, change the viewpoint, change which attributes are filtered, change the aggregation level”", "note": "Values are our derivation from MU’s list. Absorbs D14 (eliminate vs merge = removes vs aggregates). Fixed by category (2026-09-25): a new result that appears in place of the previous one (e.g., a re-run query) is “adds”; “switches” refers to the visualization (e.g., switching the metaphor, M13)."}, {"id": "DM3", "level": "Modification", "name": "Direction (number of visible elements)", "values": "reduces; increases; keeps", "origin": "D", "q": "MU §13.2: “many of the idioms covered in this chapter are bidirectional: they may serve to either reduce or increase the number of visible elements”", "note": ""}, {"id": "DM4", "level": "Modification", "name": "Persistence", "values": "transitory; persistent", "origin": "D", "q": "MU §10.4.5: “particularly when the highlighting is transitory rather than ongoing” · MU §3.4.2.2: “The record choice saves a persistent artifact, in contrast to the annotate, which attaches information temporarily”", "note": ""}, {"id": "DM6", "level": "Modification", "name": "Scope", "values": "one view; multiple views", "origin": "D", "q": "MU §12.4, p. 281: “A view is a contiguous region in which visually encoded data is shown on the display.” · MU ch. 12: multiple views, linked highlighting, linked navigation", "note": "More than one view involved already counts as multiple views (2026-09-25). Small nested regions (charts inside a list row) are glyphs, not views; panels with only controls are not views."}, {"id": "DM7", "level": "Modification", "name": "Reversibility", "values": "reversible; irreversible", "origin": "D", "q": "DP §3.1.3: directness associated with actions that are “rapid, incremental, and reversible” · GZ Tab. 1: Undo", "note": ""}, {"id": "DR1", "level": "Relation A×I", "name": "Combination mode", "values": "single; sequence (with order)  —  different implementations of the same action are alternatives", "origin": "D", "q": "GZ §5.1: three alternative gestures for Zoom · GZ §4: nine events in sequence for a single Sort", "note": "Steps that only prepare an action (setting its arguments) stay in the same row, in order; the modification is recorded once, at the final effect (2026-09-25)."}, {"id": "DR2", "level": "Relation A×I", "name": "Interaction surface", "values": "widget; representation (mark or view); no on-screen target", "origin": "D", "q": "DP §3.1.3: “dynamic queries are now said to be indirect because the user interacts with intermediate, likely spatially distant widgets – as opposed to interacting directly with the representation of the data itself”", "note": "Operationalizes DP’s direct–indirect continuum. This is where widgets went. Varies with use, so it lives on the relation."}, {"id": "DR3", "level": "Relation A×I", "name": "Cardinality of interaction means (metric)", "values": "number of implementations per action", "origin": "L", "q": "DP §6.2: “the number of interaction means with which the person can perform each action”", "note": "implementations)."}, {"id": "S1", "level": "Structural", "name": "Granularity", "values": "event; action; sub-task; task", "origin": "L", "q": "GZ §4: “tasks, sub-tasks, actions, and events”", "note": "Classifies no item: these are the levels themselves. Event → Interaction, Action → Action; task and sub-task are out."}, {"id": "S2", "level": "Structural", "name": "Intent vs. system response", "values": "—", "origin": "L", "q": "GZ §5.3: “based on the user’s primary intention, not the eventual system response”", "note": "This is the Action / Modification split. It became structure, not a dimension."}, {"id": "S3", "level": "Structural", "name": "Visual metaphor", "values": "map; timeline; treemap…", "origin": "D", "q": "GZ §5.1: “Our action representation is invariant to the underlying visual metaphor”", "note": "Describes the system, not the interaction."}, {"id": "S4", "level": "Structural", "name": "Domain dependence", "values": "—", "origin": "D", "q": "GZ §4: tasks are domain-specific; actions are generic", "note": "Every action is generic by definition."}, {"id": "S5", "level": "Structural", "name": "Observability", "values": "capturable; internal", "origin": "D", "q": "RA §4.1: interaction vs. rationale provenance", "note": "Classifies what can be recorded — relevant to provenance, not to the space."}], "stats": {"meta": {"papers": 100, "rows": 1456, "seeds": "20260926 · 20260930 · 20261001 · 20261002 · 20261003 · 20261004 · 20261005 · 20261006 · 20261007 · 20261008", "corpus": 285, "date": "07/10/2026", "sim": 39}, "groups": [{"k": "human", "papers": 2, "rows": 26}, {"k": "r8", "papers": 8, "rows": 109}, {"k": "r5", "papers": 5, "rows": 76}, {"k": "r15", "papers": 15, "rows": 189}, {"k": "r20", "papers": 20, "rows": 310}, {"k": "r10", "papers": 10, "rows": 146}, {"k": "r10b", "papers": 10, "rows": 134}, {"k": "r5b", "papers": 5, "rows": 94}, {"k": "r10c", "papers": 10, "rows": 141}, {"k": "r10d", "papers": 10, "rows": 155}, {"k": "r5c", "papers": 5, "rows": 76}], "perpaper": [{"id": "P272", "rows": 15, "group": "human", "year": 2020, "title": "In Search of Patient Zero: Visual Analytics of Pathogen Transm /* values of dims shown with icons in the Dimensions tab */
const DIMKEYS = {DI1:'mod', DI2:'dev', DI3:'cont', DM1:'where', DM2:'how', DA1:'intent', DA2:'element', DA4:'visref', DA7:'chain'};
const LEVELS = {i:['Interação','Interaction'], a:['Ação','Action'], o:['Modificação','Modification']};
/* every dimension of a level, classified or not, in the order of the Dimensions tab */
function dimsOf(t){
  const ds = D.dims.filter(d=>LEVELS[t].includes(d.level) && DIMKEYS[d.id]).map(d=>({
    key: DIMKEYS[d.id] || d.id, name: d.id+' · '+d.name, classified: !!DIMKEYS[d.id],
    values: DIMKEYS[d.id] ? ORDER[DIMKEYS[d.id]].map(val).join(' · ') : d.values }));
  if(t==='a') ds.push({key:'gesture', name:L().fact, classified:true, values:ORDER.gesture.map(k=>L().gesture[k]).join(' · ')});
  return ds.sort((a,b)=> (b.classified?1:0) - (a.classified?1:0));
}
const SRC = {
 YI:{s:'Yi et al. 2007', f:'Yi, J. S., Kang, Y., Stasko, J. T., & Jacko, J. A. (2007). Toward a Deeper Understanding of the Role of Interaction in Information Visualization. IEEE TVCG 13(6), 1224–1231.'},

};

/* ---------------- state */
const lang = 'en';
const st = {tab:'explore', g:{i:0, a:0, o:0}, g2:{i:1, a:3, o:1}, sel:null, q:'', col:'a'};

let D, byI, byA, byO, aiByA, aiByI, amByA, amByO;
function index(){
  D = DATA[lang];
  byI = Object.fromEntries(D.interactions.map(x=>[x.id,x]));
  byA = Object.fromEntries(D.actions.map(x=>[x.id,x]));
  byO = Object.fromEntries(D.outputs.map(x=>[x.id,x]));
  aiByA={}; aiByI={}; amByA={}; amByO={};
  D.ai.forEach(r=>{(aiByA[r.a]=aiByA[r.a]||[]).push(r); (aiByI[r.i]=aiByI[r.i]||[]).push(r);});
  D.am.forEach(r=>{(amByA[r.a]=amByA[r.a]||[]).push(r); (amByO[r.m]=amByO[r.m]||[]).push(r);});
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nsrc = marks => Object.values(marks).filter(v=>v).length;
const L = () => T[lang];
const val = k => VAL[lang][k] || k;
const locTxt = l => (l||'').replace(/Tab\.\s*1/,L().tab1);

function dimKeys(type, x, d){ const k = dimKey(type, x, d); return Array.isArray(k) ? k : [k]; }
function dimKey(type, x, d){
  if(!d || !d.classified) return 'unclassified';
  const k = d.key;
  if(type==='i') return x.dims[k];
  if(type==='o') return k==='where' ? x.whereKey : x.howKey;
  return k==='gesture' ? (aiByA[x.id] ? 'has' : 'none') : x.dims[k];
}
const dimAt = (t,i) => { const ds = dimsOf(t); return ds[Math.min(i, ds.length-1)]; };
const suggCount = t => D.dims.filter(d=>LEVELS[t].includes(d.level) && !DIMKEYS[d.id]).length;
const groupKey = (type, x) => dimKey(type, x, dimAt(type, st.g[type]));
const orderOf = type => { const d = dimAt(type, st.g[type]); return d.classified ? ORDER[d.key] : ['unclassified']; };
const keyLabel = (type,d,k) => k==='unclassified' ? L().unclass : (d.key==='gesture' ? L().gesture[k] : val(k));

/* ---------------- links for highlighting */
function linked(){
  const s = st.sel, r = {i:{}, a:{}, o:{}};
  if(!s) return null;
  const set = (t,id,lv)=>{ if(!r[t][id] || r[t][id]>lv) r[t][id]=lv; };
  set(s.t, s.id, 0);
  if(s.t==='i'){ (aiByI[s.id]||[]).forEach(x=>{ set('a',x.a,1); (amByA[x.a]||[]).forEach(m=>set('o',m.m,2)); }); }
  if(s.t==='a'){ (aiByA[s.id]||[]).forEach(x=>set('i',x.i,1)); (amByA[s.id]||[]).forEach(m=>set('o',m.m,1)); }
  if(s.t==='o'){ (amByO[s.id]||[]).forEach(m=>{ set('a',m.a,1); (aiByA[m.a]||[]).forEach(x=>set('i',x.i,2)); }); }
  return r;
}

}

/* ---------------- explore */
function renderExplore(){
  const lk = linked();
  const q = st.q.trim().toLowerCase();
  const col = (t, items, nameOf, metaOf) => {
    const ds = dimsOf(t), d1 = dimAt(t, st.g[t]), d2 = dimAt(t, st.g2[t]);
    const slider = (which, d, idx) => `<div class="dimslider"><span class="lab2">${which==='g'?L().groupby:L().show}</span>
        <button type="button" class="arw" data-${which}="${t}" data-step="-1" aria-label="${L().prev}">‹</button>
        <span class="dname" title="${esc(d.name)}">${esc(d.name)}</span>
        <button type="button" class="arw" data-${which}="${t}" data-step="1" aria-label="${L().next}">›</button>
        <span class="dots">${ds.map((_,k)=>`<i class="${k===idx?'on':''}${ds[k].classified?'':' un'}"></i>`).join('')}</span></div>`;
    const groups = {};
    items.filter(x=>!q || (x.id+' '+nameOf(x)+' '+(x.desc||x.def||'')).toLowerCase().includes(q))
         .forEach(x=>{ dimKeys(t,x,d1).forEach(k=>{ (groups[k]=groups[k]||[]).push(x); }); });
    const body = orderOf(t).filter(k=>groups[k]).map(k=>`<div class="grp"><div class="grp-h">${ic(k==='unclassified'?'none':k)}${esc(keyLabel(t,d1,k))}<span style="margin-left:auto">${groups[k].length}</span></div>
      ${groups[k].map(x=>{ const lv = lk ? lk[t][x.id] : undefined; const cls = lv===0?'sel':lv===1?'l1':lv===2?'l2':'';
        const m = metaOf(x); const ks2 = dimKeys(t,x,d2), k2 = ks2[0], more2 = ks2.length-1;
        return `<button type="button" class="item ${cls}" id="it-${x.id}" data-id2="${k}" data-t="${t}" data-id="${x.id}" aria-pressed="${lv===0}">
          <span class="ico">${ic(k)}</span>
          <span class="txt"><span class="nm"><span class="code">${esc(x.id)}</span>${esc(nameOf(x))}</span>
            <span class="row2"><span class="d2">${k2==='unclassified'?`<span class="k">${esc(d2.name)}:</span> ${L().unclassShort}`:ic(k2)+esc(keyLabel(t,d2,k2))+(more2>0?` +${more2}`:'')}</span><span class="meta ${m[1]||''}">${esc(m[0])}</span></span></span></button>`; }).join('')}
      </div>`).join('') || `<p class="empty">${L().empty}</p>`;
    return `<section class="col ${t} ${st.col===t?'show':''}" aria-label="${L()[t]}">
      <div class="colhead"><div class="t">${ic('level_'+t)}<h2>${L()[t]}</h2><span class="cnt">${items.length}</span></div>
        ${slider('g', d1, st.g[t])}${slider('g2', d2, st.g2[t])}
        <p class="dvals">${esc(d1.values)}</p></div>
      <div class="list ${lk?'hasSel':''}">${body}</div></section>`;
  };
  const selName = st.sel ? st.sel.id+' · '+((st.sel.t==='i'?byI:st.sel.t==='a'?byA:byO)[st.sel.id]?.name||'') : '';
  main.innerHTML = `<div class="wrap">
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="${L().search}" value="${esc(st.q)}" aria-label="${L().search}">
      ${st.sel?`<span class="selpath">${ic('level_'+st.sel.t)}<b>${esc(selName)}</b><button type="button" class="clear" id="clear">${L().clear}</button></span>`:''}
      <div class="colswitch" role="group">${['i','a','o'].map(t=>`<button type="button" class="${t}" data-col="${t}" aria-pressed="${st.col===t}">${L()[t]}</button>`).join('')}</div>
    </div>

      ${col('a', D.actions, x=>x.name, x=> aiByA[x.id] ? [L().nSrc(nsrc(x.marks))] : [L().noGesture,'gap'])}
      ${col('o', D.outputs, x=>x.name, x=>[L().nSrc(nsrc(x.marks))])}
      <aside class="detail" id="detail" ${st.sel?'':'hidden'} aria-label="detail">${st.sel?renderDetail():''}</aside>
    </div></div>`;
  backdrop.classList.toggle('on', !!st.sel && window.innerWidth<=1180);
  const qi = document.getElementById('q');

/* ---------------- detail */
function whyBlock(x, ev){
  const out = [];
  Object.entries(x.marks).filter(([k,v])=>v).forEach(([k,v])=>{
    const qs = (ev||[]).filter(e=>e.src===k);
    const nm = x.names && x.names[k];
    out.push(`<div class="src ${v}"><span class="who"><b>${SRC[k].s}</b><span class="role">${L().role[v]}</span></span>
      ${nm?`<span class="loc">${L().callsIt}: ${esc(nm)}</span>`:''}
      ${qs.map(e=>`<blockquote>${esc(e.q)}</blockquote><span class="loc">${esc(locTxt(e.loc))}</span>`).join('')}</div>`);
  });
  (ev||[]).filter(e=>e.src==='MTG').forEach(e=> out.push(`<div class="src"><span class="who"><b>${L().mtg}</b> <span class="loc">${esc(e.loc)}</span></span><blockquote>${esc(e.q)}</blockquote></div>`));
  const plain = (ev||[]).filter(e=>!e.src);
  if(!out.length) out.push(`<div class="callout">${esc(plain.map(e=>e.q).join(' '))}</div>`);
  return `<div class="why">${out.join('')}</div>`;
}
const chipI = id => `<button type="button" class="chip i" data-t="i" data-id="${id}">${ic(byI[id].dims.mod)}<span class="code">${id}</span>${esc(byI[id].name)}</button>`;
const chipA = id => `<button type="button" class="chip a" data-t="a" data-id="${id}">${ic('level_a')}<span class="code">${id}</span>${esc(byA[id].name)}</button>`;
const chipO = id => `<button type="button" class="chip o" data-t="o" data-id="${id}">${ic(byO[id].whereKey)}<span class="code">${id}</span>${esc(byO[id].name)}</button>`;
const origin = o => `<span class="orig ${o}">${L().orig[o]}</span>`;
function srcLabel(s){ // "GZ Tab. 1 · MU §13.3" → "Gotz & Zhou 2008 · Tabela 1 · Munzner 2014 §13.3"
  return (s||'').split('·').map(p=>p.trim()).filter(p=>p && p!=='—').map(p=>{
    const m = p.match(/^(YI|GZ|MU|RA|DP)\s*(.*)$/); if(m) return `${SRC[m[1]].s} ${locTxt(m[2])}`.trim();
    if(/^(R17|M17)/.test(p)) return L().mtg; return p; }).join(' · ');
}
function implCards(rows){
  const g = {}; rows.forEach(r=>{(g[r.grp]=g[r.grp]||[]).push(r);});
  return Object.values(g).map(rs=>{
    rs.sort((a,b)=>a.order-b.order); const r0 = rs[0]; const seq = rs.length>1;
    const name = r0.impl || srcLabel(r0.src) || L().orig.T;
    return `<div class="impl"><div class="ih"><b>${esc(name)}</b><span class="loc">${esc(seq?L().sequence:L().single)}</span>
        <span class="surf">${ic(r0.surface)}${L().surf[r0.surface]}</span></div>
      <div class="seq">${rs.map((r,k)=>(k?'<span class="sep">→</span>':'')+chipI(r.i)).join('')}</div>
      ${rs.filter(r=>r.q).map(r=>`<blockquote>${esc(r.q)}</blockquote>`).join('')}
      <span class="loc">${r0.src?esc(srcLabel(r0.src))+' — ':''}${origin(r0.origin)}</span></div>`;
  }).join('');
}
function renderDetail(){

      <section><span class="lab">${L().why}</span>${nsrc(x.marks)||x.ev.some(e=>e.src)?whyBlock(x,x.ev):`<div class="callout">${L().noSourceI} ${esc(x.note)}</div>`}</section>
      ${x.note && nsrc(x.marks)?`<section><span class="lab">${L().obs}</span><p class="note">${esc(x.note)}</p></section>`:''}
      <section><span class="lab">${L().executes}</span>${uniq.length?uniq.map(a=>{ const r = acts.find(z=>z.a===a);
          return `<div class="prod">${chipA(a)}<span class="loc">${esc(r.impl||srcLabel(r.src)||'')}${(r.impl||r.src)?' · ':''}${L().surf[r.surface]} — ${origin(r.origin)}</span></div>`;}).join(''):'<p class="note">—</p>'}</section>`;
  }
  if(t==='a'){
    x = byA[s.id];
    head = ic('level_a');
    const ims = aiByA[x.id]||[]; const nImpl = new Set(ims.map(r=>r.grp)).size;
    body = `<section><span class="lab">${L().dims}</span><div class="chips">
        <span class="chip">${ic(x.dims.intent)}<span class="k">DA1 · ${L().ga.intent}:</span> ${esc(val(x.dims.intent))}</span>
        ${x.dims.element.map(e=>`<span class="chip">${ic(e)}<span class="k">DA2:</span> ${esc(val(e))}</span>`).join('')}
        <span class="chip">${ic(x.dims.visref)}<span class="k">DA4 · ${L().ga.visref}:</span> ${esc(val(x.dims.visref))}</span>
        <span class="chip">${ic(x.dims.chain)}<span class="k">DA7:</span> ${esc(val(x.dims.chain))}</span></div>
        ${x.chainWhy?`<span class="loc">${esc(x.chainWhy)}</span>`:''}
        <span class="loc">${L().moreIn(suggCount('a'))}</span>
        <div class="src ${x.intentOrigin==='T'?'X':''}"><span class="who"><span class="role">${L().cOrig[x.intentOrigin]}</span></span><p class="lead">${esc(x.intentWhy)}</p></div>
        ${x.dims.intent==='register'||x.dims.intent==='history'||x.dims.intent==='input'?`<span class="loc">${L().extNote}</span>`:''}</section>
      <section><span class="lab">${L().def}</span><blockquote>${esc(x.def)}</blockquote><span class="loc">${esc(srcLabel(x.defsrc))}</span></section>
      <section><span class="lab">${L().why}</span>${whyBlock(x,[])}</section>
      <section><span class="lab">${L().howExec}</span>${ims.length?`<span class="loc">${nImpl>1?L().alt(nImpl):''}</span>${implCards(ims)}`:`<div class="callout">${L().noGestureA}</div>`}</section>
      <section><span class="lab">${L().produces}</span>${(amByA[x.id]||[]).map(m=>`<div class="prod">${chipO(m.m)}${m.note?`<span class="lead" style="font-size:.84rem">${esc(m.note)}</span>`:''}<span class="loc">${esc(srcLabel(m.src))} — ${origin(m.origin)}</span></div>`).join('')}</section>
      ${x.input?`<section><span class="lab">${L().input}</span><p class="note">${esc(x.input)}</p></section>`:''}
      ${x.note?`<section><span class="lab">${L().obs}</span><p class="note">${esc(x.note)}</p></section>`:''}`;
  }
  if(t==='o'){
    x = byO[s.id];
    head = ic(x.whereKey);
    body = `<section><span class="lab">${L().dims}</span><div class="chips">
        <span class="chip">${ic(x.whereKey)}<span class="k">DM1 · ${L().where}:</span> ${esc(val(x.whereKey))}</span>
        <span class="chip">${ic(x.howKey)}<span class="k">DM2 · ${L().how}:</span> ${esc(val(x.howKey))}</span></div>
        <span class="loc">${L().moreIn(suggCount('o'))}</span></section>
      <section><span class="lab">${L().why}</span>${whyBlock(x,x.ev)}</section>
      ${x.note?`<section><span class="lab">${L().obs}</span><p class="note">${esc(x.note)}</p></section>`:''}
      <section><span class="lab">${L().producedBy}</span>${(amByO[x.id]||[]).map(m=>`<div class="prod">${chipA(m.a)}<span class="loc">${esc(srcLabel(m.src))} — ${origin(m.origin)}</span></div>`).join('')}</section>`;
  }
  return `<div class="dhead"><div class="row"><span class="ico" style="background:${col}">${head}</span>
      <div><span class="lab">${L()[t+'1']}</span><h2 class="${t==='i'?'mono':''}"><span class="code">${esc(x.id)}</span>${esc(x.name)}</h2></div>
      <button type="button" class="x" id="close" aria-label="${L().close}">×</button></div>
      <button type="button" class="simgo" data-simt="${t}" data-simid="${x.id}">▶ ${S_.simulate}</button></div>
    <div class="dbody">${body}</div>`;
}

/* ================= SIMULATOR — interaction → action → output =================
   Lives inside the page IIFE. Uses D, byI, byA, byO, aiByA, aiByI, amByA, amByO, L(), val(), ic(), esc(), st, srcLabel.
   Scene: a made-up scatter plot (12 items, 3 categories), a widget panel, a history strip and a bookmark strip.
   Each (interaction, action) pair gets a READING (plan): where the interaction lands, what it picks as operand,
   whether it drives the action continuously, and which parameter it supplies. The output then depends on that reading. */
const SIM = { i: null, a: null, m: null, t: 0, playing: false, loop: true, raf: 0, last: 0 };
const DUR = { g: 1.7, a: 0.5, e: 1.9, hold: 1.1 };
const TOTAL = DUR.g + DUR.a + DUR.e + DUR.hold;
const PTS = [
  {x:.10,y:.30,c:0},{x:.20,y:.62,c:1},{x:.29,y:.44,c:0},{x:.37,y:.82,c:2},{x:.45,y:.24,c:1},{x:.53,y:.56,c:2},
  {x:.61,y:.71,c:0},{x:.67,y:.36,c:1},{x:.75,y:.86,c:2},{x:.82,y:.49,c:0},{x:.88,y:.19,c:1},{x:.95,y:.66,c:2}];
const FOCUS = 5;
const PX = 40, PY = 30, PW = 340, PH = 230;
const X = x => PX + x * PW, Y = y => PY + PH - y * PH;
const IX = px => (px - PX) / PW, IY = py => (PY + PH - py) / PH;
const clamp = v => Math.max(0, Math.min(1, v));
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

const S_ = {
  tab:'Simulate', title:'Simulate an interaction',
  lead:'Pick the interaction, the action and the output. Play shows the interaction performing the action and the change it produces. The same interaction can mean different things for different actions — the reading below the animation says how this pair is interpreted. Illustrative simulation on a made-up chart; it does not reproduce a real system.',
  pickI:'1 · Interaction', pickA:'2 · Action', pickM:'3 · Output', play:'Play', pause:'Pause', loop:'loop',
  random:'Pick a combination described in the sources',
  described:(impl, src) => `Combination described in the sources${impl ? ` — ${impl}` : ''}${src ? ` (${src})` : ''}.`,
  team:'Combination proposed by the team, no written source.',
  hypo:'Hypothetical combination: none of the sources describes this interaction for this action.',
  step1:'interaction', step2:'action', step3:'output', dot:'● = interaction described in the sources for this action',
  reading:'How this pair is read', weak:'weak pairing',
  roleLab:{ trigger:'triggers the action', operand:'picks the operand', continuous:'drives it continuously', parameter:'supplies a parameter' },
  onw:{ widget:'on a widget', rep:'on the representation', none:'no on-screen target', history:'on the history' },
  search:'search…', hist:'history', marks:'bookmarks', empty:'empty — every action is recorded here',
  mean:'mean', notes:'notes', item:'item', price:'price', simulate:'Simulate', now:'now',
  story:{ A39:'Undo drops the last step (sort): the chart goes back to how it was after zoom.',
          A40:'Redo re-applies the undone step (sort): the items line up again.',
          A41:'Reset clears every step: the chart returns to its initial state.',
          A42:'Delete removes zoom from the middle of the history: filter and sort are re-run without it.',
          A43:'Edit changes the filter from price > 50 to price > 30: the steps after it are re-run, and more items come back.',
          A44:'Revisit goes back to the state right after filter; zoom and sort stay in the history as later steps.',
          A07:'Restore brings back the saved bookmark (“filter only”): the chart jumps to that state.' }
};
const TXT = { A01:'price > 50', A02:'price > 50', A03:'category = B', A04:'sales_2025.csv', A05:'55 → 72', A06:'mean(price)', A16:'sort by price',
  A28:'category C', A29:'category C', A30:'category C', A33:'peak in March', A35:'check outliers', A36:'check outliers ✓', A37:'delete note', A38:'hypothesis: seasonal',
  A32:'item 6', A23:'show as bars', A24:'size by price', A43:'price > 30', A08:'zoom in', A10:'move right', A21:'group by category', A11:'rotate' };
const KEYS = { A39:'Ctrl Z', A40:'Ctrl Y', A42:'Del', A10:'→', A08:'+', A09:'+', A11:'R', A28:'Shift', A29:'H', A41:'Esc', A34:'Ctrl D', A43:'F2', A44:'Alt ←', A07:'Ctrl R', A16:'S', A02:'F', A33:'N', A35:'N' };
const txtFor = a => TXT[a] || byA[a].name;
const shortName = a => byA[a].name.split(/ \/ | \(/)[0];

/* ---------- action kinds ---------- */
const MAGNITUDE = ['A02','A08','A09','A10','A11','A12','A13','A15','A18','A24','A25'];          /* a quantity: amount, range, angle, threshold */
const OPERAND   = ['A05','A17','A19','A20','A21','A22','A26','A27','A28','A29','A30','A31','A32','A33']; /* acts on chosen items */
const HISTORY   = ['A07','A39','A40','A41','A42','A43','A44'];
const kindOf = a => HISTORY.includes(a) ? 'history' : MAGNITUDE.includes(a) ? 'magnitude' : OPERAND.includes(a) ? 'operand' : 'global';
const PARAM = { A02:'price threshold', A08:'zoom level', A09:'zoom level', A10:'view position', A11:'angle', A12:'slice value', A13:'cutting plane', A15:'view position', A18:'baseline', A24:'mark size', A25:'size range' };

function relFor(a, i){ return D.ai.find(r => r.a === a && r.i === i); }
function widgetKind(label){
  const l = (label || '').toLowerCase();
  if (l.includes('slider')) return 'slider';
  if (l.includes('checkbox')) return 'checkbox';
  if (l.includes('menu')) return 'menu';
  if (l.includes('scroll')) return 'scrollbar';
  if (l.includes('field') || l.includes('campo') || l.includes('shelf') || l.includes('painel')) return 'field';
  return 'button';
}

/* ---------- geometry of targets ---------- */
const FP = () => ({ x: X(PTS[FOCUS].x), y: Y(PTS[FOCUS].y) });
/* widgets exist only when the interaction uses them; they share one slot on the right, below the linked view */
const W = { slider:{x:450, y:195, x2:530, y2:195}, checkbox:{x:434, y:195}, button:{x:495, y:195}, field:{x:495, y:195}, attr:{x:458, y:150}, scrollbar:{x:150, y:276, x2:250, y2:276}, bookmark:{x:458, y:318} };
const CHIPX = k => 40 + k * 90;
const CHIP_OF = { A39:2, A40:2, A42:1, A43:0, A44:0 };
/* region interactions: the enclosed set is computed from the same shape that is drawn, and the shapes
   are placed so that no item sits on the boundary (every item is ≥ ~20 px inside or outside) */
const LASSO = { cx: 204, cy: 94, rx: 72, ry: 62, a0: -2.2 };
const LSTART = { x: LASSO.cx + LASSO.rx * Math.cos(LASSO.a0), y: LASSO.cy + LASSO.ry * Math.sin(LASSO.a0) };
const RECT = { x: 150, y: 48, w: 125, h: 100 };
function inLasso(p){ return ((X(p.x) - LASSO.cx) / LASSO.rx)**2 + ((Y(p.y) - LASSO.cy) / LASSO.ry)**2 <= 1; }
function inRect(p){ const x = X(p.x), y = Y(p.y); return x >= RECT.x && x <= RECT.x + RECT.w && y >= RECT.y && y <= RECT.y + RECT.h; }
const LASSO_SET = () => PTS.map((p, k) => inLasso(p) ? k : -1).filter(k => k >= 0);
const RECT_SET = () => PTS.map((p, k) => inRect(p) ? k : -1).filter(k => k >= 0);
const CAT_SET = c => PTS.map((p, k) => p.c === c ? k : -1).filter(k => k >= 0);

/* ---------- the reading of each (interaction, action) pair ---------- */
const REGION_READ = {
  A02:'The lasso picks the enclosed items: only they remain (filter by selection).',
  A03:'The lasso picks the enclosed data items: they go into the output subset, and the view keeps only them.',
  A08:'The lasso marks a region: the view zooms to fit the enclosed items.',
  A09:'The lasso marks a region: the view zooms to fit it and the marks adapt.',
  A10:'The lasso marks a region: the view recenters on it.',
  A15:'The lasso marks a region: the view recenters on it, and the linked view follows.',
  A16:'The lasso picks the enclosed items: only they are reordered, within the positions they already occupy.',
  A21:'The lasso picks the enclosed items: they are aggregated into a single mark.',
  A23:'The lasso picks the enclosed items: only they switch encoding.',
  A24:'The lasso picks the enclosed items: only they get the new channel.',
  A32:'The lasso picks the enclosed items: the details summarize the group.',
  A33:'The lasso picks the enclosed items: the annotation is attached to the group.' };
function plan(a, i){
  const P = plan0(a, i);
  if (a === 'A03' && !P.scope && !P.weak) { P.scope = CAT_SET(1); P.reading += ' The condition (category = B) defines the subset, which goes into the output.'; }
  if (['A19','A20','A21'].includes(a) && P.scope && P.scope.length === 1) P.scope = CAT_SET(PTS[P.scope[0]].c);
  return P;
}
function plan0(a, i){
  const n = byI[i].name, k = kindOf(a), r = relFor(a, i), lab = shortName(a);
  const P = { role:'trigger', surface:'widget', target:{ kind:'button', ...W.button }, scope:null, live:false, weak:false, variant:'cmd', button:lab, reading:'' };
  const V = { click:'Click', 'double-click':'Double-click', 'right-click':'Right-click', touch:'Tap', hover:'Hover over', gaze:'Look at', point:'Point at', 'place object':'Place a token on' }[n] || 'Use';
  const wk = r && r.surface === 'widget' ? widgetKind(r.surfaceLabel) : null;
  const set = (o) => Object.assign(P, o);
  const PICKS = ['click','double-click','right-click','touch','hover','gaze','point','place object'];

  /* a widget named by the source wins */
  if (wk === 'slider')    { set({ role:'continuous', live:true, target:{ kind:'slider', ...W.slider }, variant:'slider', reading:`Dragging the slider changes the ${PARAM[a] || 'parameter'} continuously — the chart updates during the drag.` }); return P; }
  if (wk === 'checkbox')  { set({ role:'parameter', target:{ kind:'checkbox', ...W.checkbox }, variant:'category', reading:'Unticking “show category B” sets the condition: category B leaves the view.' }); return P; }
  if (wk === 'scrollbar') { set({ role:'continuous', live:true, target:{ kind:'scrollbar', ...W.scrollbar }, variant:'scrollbar', reading:'Dragging the scrollbar moves the view continuously.' }); return P; }
  if (wk === 'field' && n === 'drag') { set({ role:'parameter', target:{ kind:'field', ...W.field, x2:W.field.x, y2:W.field.y }, variant:'shelf', reading:`Dropping the attribute on a shelf tells the system how to ${lab.toLowerCase()}.` }); P.target = { kind:'drop', x:W.attr.x, y:W.attr.y, x2:W.field.x, y2:W.field.y }; return P; }

  /* history: the operand is a step of the history (or the bookmark) */
  if (k === 'history'){
    set({ surface:'history' });
    const chipIdx = CHIP_OF[a];
    const onChip = chipIdx != null ? { kind:'chip', x:CHIPX(chipIdx) + 42, y:316 } : a === 'A07' ? { kind:'bookmark', ...W.bookmark } : null;
    if (['key','voice'].includes(n)){ set({ surface:'none', target:{ kind:'none' }, variant:'cmd', reading: n === 'key' ? `The shortcut ${KEYS[a] || '↵'} applies ${lab} to the current history.` : `The spoken command “${lab.toLowerCase()}” applies it to the current history.` }); return P; }
    if (n === 'drag' && onChip){
      if (a === 'A42') set({ role:'operand', target:{ ...onChip, kind:'drop', x2:onChip.x + 30, y2:onChip.y + 24 }, variant:'dragout', reading:'Dragging the “zoom” step out of the history removes it; the steps after it are re-run.' });
      else if (a === 'A07') set({ role:'operand', target:{ ...onChip, kind:'drop', x2:X(.5), y2:Y(.5) }, variant:'dragin', reading:'Dragging the saved bookmark onto the chart restores that state.' });
      else { const tp = STORIES[a].tip, cx = j => j < 0 ? 22 : CHIPX(j) + 42; set({ role:'operand', target:{ kind:'drop', x:cx(tp[0]), y:338, x2:cx(tp[1]), y2:338 }, variant:'marker', reading:'Dragging the “now” marker along the history moves the analysis to that step.' }); }
      return P;
    }
    if (PICKS.includes(n) && onChip){
      const verb = n === 'right-click' ? 'Right-click' : V;
      const stepLab = a === 'A07' ? 'saved bookmark' : `“${STEP[STORIES[a].chips[chipIdx][0]].lab.replace(/\s+/g, ' ')}” step in the history`;
      set({ role:'operand', target:onChip, variant:n === 'right-click' ? 'menu' : 'pick',
            reading: n === 'right-click' ? `Right-clicking the ${stepLab} opens its menu; choosing “${lab}” acts on that step.` : `${verb} the ${stepLab}: ${lab} acts on it.` });
      return P;
    }
    if (PICKS.includes(n)){ set({ reading:`${V} the “${lab}” button: it acts on the whole history.` }); return P; }
    set({ weak:true, surface:'none', target:{ kind:'none' }, reading:'No natural reading for this pair — here the interaction only triggers the action.' });
    return P;
  }

  switch (n){
    case 'trace (brush / lasso / draw)':
      if (a === 'A02' || a === 'A01') { set({ role:'parameter', surface:'rep', target:{ kind:'sketch', ...FP() }, variant:'sketch', reading:'The traced curve is the query: only items that follow the curve remain.' }); return P; }
      if (a === 'A13') { set({ role:'continuous', live:true, surface:'rep', target:{ kind:'line', ...FP() }, variant:'cutline', reading:'The traced line is the cutting plane: everything left of it is hidden.' }); return P; }
      if (['A35','A36','A38','A33'].includes(a)) { set({ role:'parameter', surface:'rep', target:{ kind:'sketch', ...FP() }, variant:'handwrite', reading:'The note is handwritten on the chart; the stroke is the content.' }); return P; }
      set({ role:'operand', surface:'rep', target:{ kind:'region', ...LSTART }, scope:LASSO_SET(), variant:'region', reading: REGION_READ[a] || `The lasso picks the enclosed items; ${lab} applies only to them.` });
      if ((k === 'global' && !REGION_READ[a]) || (k === 'magnitude' && !REGION_READ[a])) set({ weak:true, scope:null, reading:`The lasso encloses items, but ${lab} does not take items as operand — here it only triggers the action, on the whole view.` });
      return P;
    case 'type':
      set({ role:'parameter', target:{ kind:'field', ...W.field }, variant:'text', reading:`Typing gives the parameter as text: “${txtFor(a)}”.` });
      if (['A28','A29','A30'].includes(a)) set({ scope:CAT_SET(2) });
      return P;
    case 'voice':
      set({ role:'trigger', surface:'none', target:{ kind:'none' }, variant:'text', reading:`The spoken command names the action and its parameter: “${txtFor(a)}”.` });
      if (['A28','A29','A30'].includes(a)) set({ scope:CAT_SET(2) });
      return P;
    case 'key':
      set({ surface:'none', target:{ kind:'none' }, variant:'key', reading:`The shortcut ${KEYS[a] || '↵'} applies ${lab} to the current view.` });
      if (a === 'A28') set({ role:'operand', scope:[FOCUS, 6], reading:'Shift extends the current selection to the next item.' });
      else if (k === 'operand') set({ scope:[FOCUS], reading:`The shortcut ${KEYS[a] || '↵'} applies ${lab} to the item that has the focus.` });
      else if (k === 'magnitude') set({ role:'parameter', reading:`Each press of ${KEYS[a] || '↵'} changes the ${PARAM[a] || 'parameter'} by one step.` });
      return P;
    case 'drag':
      if (k === 'magnitude'){
        if (a === 'A08') { set({ role:'operand', surface:'rep', target:{ kind:'rect', x:RECT.x, y:RECT.y }, variant:'rubber', reading:'Dragging a rectangle marks the region to zoom into.' }); return P; }
        if (['A02','A24','A25','A09'].includes(a)) { set({ role:'continuous', live:true, target:{ kind:'slider', ...W.slider }, variant:'slider', reading:`Dragging the slider changes the ${PARAM[a]} continuously — the chart updates during the drag.` }); return P; }
        set({ role:'continuous', live:true, surface:'rep', target:{ kind:'drop', ...FP(), x2:X(.80), y2:Y(.88) }, variant:'direct', reading:`Dragging on the chart drives the ${PARAM[a] || 'parameter'} directly — the chart follows the drag.` }); return P;
      }
      if (k === 'operand'){
        if (['A28','A29','A30','A21','A32'].includes(a)) { set({ role:'operand', surface:'rep', target:{ kind:'rect', x:RECT.x, y:RECT.y }, scope:RECT_SET(), variant:'region', reading:`Dragging a rectangle picks the items inside; ${lab} applies only to them.` }); return P; }
        set({ role:'operand', live:true, surface:'rep', target:{ kind:'drop', ...FP(), x2:X(.80), y2:Y(.88) }, scope:[FOCUS], variant:'move', reading:`Dragging the item carries it: the item is the operand, the drop point is the parameter.` }); return P;
      }
      if (a === 'A04') { set({ role:'parameter', surface:'rep', target:{ kind:'drop', x:585, y:40, x2:X(.5), y2:Y(.5) }, variant:'file', reading:'Dragging a data file onto the chart brings its data in.' }); return P; }
      if (a === 'A16') { set({ role:'continuous', live:true, surface:'rep', target:{ kind:'drop', ...FP(), x2:X(.53), y2:Y(.56) }, variant:'manualsort', reading:'Dragging items into place sorts them by hand (Dimara & Perin §6.2: “rearranging data points manually”).' }); P.target = { kind:'drop', x:X(PTS[10].x), y:Y(PTS[10].y), x2:X(.05), y2:Y(PTS[10].y) }; return P; }
      if (a === 'A23') { set({ role:'parameter', target:{ kind:'drop', x:W.attr.x, y:W.attr.y, x2:W.field.x, y2:W.field.y }, variant:'shelf', reading:'Dropping the attribute on a shelf switches the encoding.' }); return P; }
      set({ weak:true, reading:`No natural reading for dragging here — it only triggers ${lab}.` }); return P;
    case 'scroll': case 'pinch':
      if (['A08','A09','A10','A15','A11','A02','A24','A25'].includes(a)){
        const par = n === 'pinch' && a === 'A11' ? 'angle' : PARAM[a];
        set({ role:'continuous', live:true, surface:'rep', target:{ kind:'plot', ...FP() }, variant:'direct', reading:`${n === 'pinch' ? 'Pinching' : 'Scrolling'} drives the ${par} continuously, around the point under the ${n === 'pinch' ? 'fingers' : 'cursor'}.` });
        return P;
      }
      set({ weak:true, surface:'none', target:{ kind:'plot', ...FP() }, reading:`No natural reading for ${n} here — it only triggers ${lab}.` }); return P;
    case 'approach':
      if (['A08','A09','A32'].includes(a)) { set({ role:'continuous', live:true, surface:'none', target:{ kind:'plot', ...FP() }, variant:'proxemic', reading:`Moving closer to the display drives ${lab.toLowerCase()} continuously (proxemic interaction).` }); return P; }

  const tg0 = DUR.g, ta0 = tg0 + DUR.a, te1 = ta0 + DUR.e;
  const gt = clamp(time / tg0);
  /* continuous interactions drive the output during the interaction; discrete ones trigger it afterwards */
  const liveStart = .38 * tg0;
  const at = P.live ? clamp((time - liveStart) / DUR.a) : clamp((time - tg0) / DUR.a);
  const et = P.live ? clamp((time - liveStart) / (tg0 - liveStart)) : clamp((time - ta0) / DUR.e);
  const fade = P.transient ? clamp(1 - (time - (te1 + .2)) / .5) : 1;
  const o = effect(SIM.m, SIM.a, P, et, fade);
  const act = byA[SIM.a].name, badgeEnd = P.live ? tg0 + .8 : te1;
  const badge = at > 0 ? `<g style="opacity:${time < badgeEnd ? Math.min(1, at*2) : clamp(1 - (time - badgeEnd) / .4)}">
      <rect x="${PX + PW/2 - (act.length*4 + 26)}" y="${PY + 8}" width="${act.length*8 + 52}" height="26" rx="13" style="fill:var(--act)"/>
      <text x="${PX + PW/2}" y="${PY + 25}" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:#fff">${esc(act)}</text></g>` : '';
  const gOp = time < tg0 ? 1 : .25 + .75 * clamp(1 - (time - tg0) / 1.2);
  const svg = document.getElementById('stage');
  if (svg) svg.innerHTML = plotSVG(o) + panelSVG(o, P, gt, time) + stripSVG(o) + badge + `<g style="opacity:${gOp}">${interaction(byI[SIM.i].name, gt, P)}</g>`;
  const phase = P.live ? (time < liveStart ? 1 : time < tg0 ? 2 : 3) : (time < tg0 ? 1 : time < ta0 ? 2 : 3);
  document.querySelectorAll('.simstep').forEach((el, k) => el.classList.toggle('on', P.live && time >= liveStart && time < tg0 ? k < 3 : k + 1 === phase));
  const bar = document.getElementById('simbar'); if (bar) bar.style.width = (100 * time / TOTAL) + '%';
}
function tick(now){
  if (!SIM.playing) return;
  const dt = SIM.last ? (now - SIM.last) / 1000 : 0; SIM.last = now;
  SIM.t += dt;
  if (SIM.t >= TOTAL){ if (SIM.loop) SIM.t = 0; else { SIM.t = TOTAL; SIM.playing = false; updPlay(); } }
  frame(SIM.t);
  if (SIM.playing) SIM.raf = requestAnimationFrame(tick);
}
function play(){ if (SIM.t >= TOTAL) SIM.t = 0; SIM.playing = true; SIM.last = 0; updPlay(); cancelAnimationFrame(SIM.raf); SIM.raf = requestAnimationFrame(tick); }
function pause(){ SIM.playing = false; cancelAnimationFrame(SIM.raf); updPlay(); }
function updPlay(){ const b = document.getElementById('simplay'); if (b) b.innerHTML = (SIM.playing ? '❚❚ ' + S_.pause : '▶ ' + S_.play); }

  onSel('sim-m', v => { SIM.m = v; });
  document.getElementById('simplay').onclick = () => SIM.playing ? pause() : play();
  document.getElementById('simloop').onchange = e => { SIM.loop = e.target.checked; };
  document.getElementById('simrand').onclick = () => { const pool = D.ai.filter(x => x.origin !== 'T'), r = pool[Math.floor(Math.random() * pool.length)]; SIM.a = r.a; SIM.i = r.i; SIM.m = null; SIM.t = 0; renderSim(); play(); };
}
function openSim(t, id){
  pause(); SIM.t = 0;
  if (t === 'a'){ SIM.a = id; SIM.i = null; SIM.m = null; }
  if (t === 'i'){ const r = (aiByI[id] || [])[0]; SIM.i = id; SIM.a = r ? r.a : (SIM.a || D.actions[0].id); SIM.m = null; }
  if (t === 'o'){ const r = (amByO[id] || [])[0]; SIM.a = r.a; SIM.m = id; SIM.i = null; }
  st.tab = 'sim'; render(); play();
}

const SCH = {W:560, WW:1160, LW:230, RH:18};   /* one geometry for every chart, so bars start at the same x in every card */
function ensureTip(){
  if(document.getElementById('stip')) return;
  const t = document.createElement('div'); t.id = 'stip'; t.hidden = true; document.body.appendChild(t);
  document.addEventListener('mousemove', ev => { const el = ev.target.closest && ev.target.closest('.tipscope [data-tip]'); const tip = document.getElementById('stip');
    if(!el){ tip.hidden = true; return; } tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (ev.clientY + 16) + 'px'; });
}
const sfmt = n => (Math.round(n*10)/10).toLocaleString('en-US');
const sae = s => esc(String(s));
const spct = (a,b) => Math.round(100*a/(b||1));
/* horizontal bars: items [{label, value, tip, muted, color}] */
function shbars(items, o){
  o = Object.assign({color:'var(--act)', lw:SCH.LW, rh:SCH.RH, W:SCH.W, max:null, unit:''}, o||{});
  const W = o.W, max = o.max || Math.max(1, ...items.map(x=>x.value)), bw = W - o.lw - 44, H = items.length*o.rh + 6;
  const maxc = Math.floor((o.lw-12)/5.9), cut = t => t.length>maxc ? t.slice(0,maxc-1)+'…' : t;
  const rows = items.map((x,k)=>{
    const y = k*o.rh + 3, w = x.value ? Math.max(2, bw*x.value/max) : 0, bh = Math.min(12, o.rh-5);
    const fill = x.muted ? 'var(--rule)' : (x.color || o.color);
    return `<g data-tip="${sae(x.tip || (x.label+': '+x.value))}"><rect x="0" y="${y-2}" width="${W}" height="${o.rh}" fill="transparent"/>
      ${x.def?`<rect x="0" y="${y-2}" width="${o.lw-4}" height="${o.rh}" fill="transparent" data-tip="${sae(x.def)}" class="sdh"/>`:''}<text x="${o.lw-8}" y="${y+bh-2}" text-anchor="end" class="sl${x.muted?' mu':''}${x.def?' sdl':''}"${x.def?` data-tip="${sae(x.def)}"`:''}>${sae(cut(x.label))}</text>
      ${w?`<path d="M${o.lw},${y} h${Math.max(0,w-3)} a3,3 0 0 1 3,3 v${bh-6} a3,3 0 0 1 -3,3 h${-Math.max(0,w-3)} z" style="fill:${fill}"/>`:''}
      <text x="${o.lw+w+5}" y="${y+bh-2}" class="sv">${x.value?sfmt(x.value)+o.unit:(x.zero||'0')}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="${sae(o.aria||'bar chart')}"><line x1="${o.lw}" x2="${o.lw}" y1="0" y2="${H}" class="sax"/>${rows}${o.extra?o.extra(H, o.lw, bw, max):''}</svg>`;
}
/* 100% stacked bars */
function sstack(rows, keys, o){
  o = Object.assign({lw:SCH.LW, rh:22, W:SCH.W}, o||{});
  const W = o.W, bw = W - o.lw - 44, H = rows.length*o.rh + 4;
  const g = rows.map((r,k)=>{
    const tot = r.parts.reduce((s,p)=>s+p.v,0) || 1, y = k*o.rh + 3, bh = Math.min(14, o.rh - 6); let x = o.lw;
    const segs = r.parts.map(p=>{ const kk = keys.find(z=>z.k===p.k), w = bw*p.v/tot;
      const s = w>0.5?`<rect x="${x}" y="${y}" width="${Math.max(0.5,w-2)}" height="${bh}" rx="2" style="fill:${kk.color}" data-tip="${sae(r.label+' · '+kk.name+': '+p.v+' ('+spct(p.v,tot)+'%)')}"/>`:''; x += w; return s; }).join('');
    const first = r.parts[0];
    return `${r.def?`<rect x="0" y="${y-3}" width="${o.lw-4}" height="${o.rh}" fill="transparent" data-tip="${sae(r.def)}" class="sdh"/>`:''}<text x="${o.lw-8}" y="${y+bh-3}" text-anchor="end" class="sl${r.def?' sdl':''}"${r.def?` data-tip="${sae(r.def)}"`:''}>${sae(r.label)}</text>${segs}<text x="${o.lw+bw+6}" y="${y+bh-3}" class="sv">${spct(first.v,tot)}%</text>`;
  }).join('');
  const leg = keys.map(k=>`<span class="lg${k.def?' sdl':''}"${k.def?` data-tip="${sae(k.def)}"`:''}><i style="background:${k.color}"></i>${sae(k.name)}</span>`).join('');
  return `<div class="legend2">${leg}</div><svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="${sae(o.aria||'stacked bars')}">${g}</svg>`;
}
/* saturation line */
function ssat(vals, ceil, color, name){
  const w = 400, h = 220, l = 14, b = 26, t = 16, r = 40, n = vals.length;
  const X = i => l + (w-l-r)*i/(n-1), Y = v => t + (h-t-b)*(1 - v/ceil);
  const d = vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const cw = (w-l-r)/(n-1);
  const hits = vals.map((v,i)=>`<rect x="${X(i)-cw/2}" y="${t}" width="${cw}" height="${h-t-b}" fill="transparent" data-tip="${sae(name)}: ${sfmt(v)} of ${ceil} after ${i+1} paper${i?'s':''}"/>`).join('');
  const last = vals[n-1];
  return `<svg viewBox="0 0 ${w} ${h}" class="schart" role="img" aria-label="${sae(name)} saturation">
    <line x1="${l}" x2="${w-r}" y1="${Y(ceil)}" y2="${Y(ceil)}" class="sgrid"/><text x="${w-r+4}" y="${Y(ceil)+4}" class="sv">${ceil}</text>
    <line x1="${l}" x2="${w-r}" y1="${Y(0)}" y2="${Y(0)}" class="sax"/>
    <text x="${l}" y="${h-6}" class="st">1</text><text x="${w-r}" y="${h-6}" text-anchor="end" class="st">${n} papers</text>
    <path d="${d}" style="stroke:${color}" class="sline"/>
    <circle cx="${X(n-1)}" cy="${Y(last)}" r="4" style="fill:${color}" class="sdot"/>
    ${Math.round(last)<ceil?`<text x="${X(n-1)+7}" y="${Y(last)+14}" class="sv">${sfmt(last)}</text>`:''}${hits}</svg>`;
}
const LVC = {Interaction:'var(--int)', 'Interaction × action':'var(--int)', Action:'var(--act)', Modification:'var(--out)', Candidate:'var(--ink-2)'};
/* dimension explorer: papers × values heat grid, with column totals on top */
function sexplorer(S, id){
  const E = S.explorer.find(e=>e.id===id) || S.explorer[0], col = LVC[E.level] || 'var(--act)';
  const ps = S.perpaper.slice().sort((a,b)=> a.year-b.year || a.id.localeCompare(b.id));
  const W = SCH.WW, lw = 230, rw = 60, k = E.values.length, cw = Math.min(70, (W-lw-rw)/k), gw = cw*k, top = 118, rh = 17, colH = 60;
  const H = top + colH + ps.length*rh + 10, maxT = Math.max(...E.totals);
  const x0 = lw, yb = top + colH;          /* grid starts here */
  const heads = E.values.map((v,j)=>{ const cx = x0 + j*cw + cw/2;
    const dv = sval(E.id, v);
    return `<text transform="translate(${cx+3},${top-8}) rotate(-38)" class="sl${dv?' sdl':''}"${dv?` data-tip="${sae(v+' — '+dv)}"`:''}>${sae(v.length>30?v.slice(0,29)+'…':v)}</text>`; }).join('');
  const colbars = E.values.map((v,j)=>{ const hh = (colH-16)*E.totals[j]/maxT, x = x0 + j*cw + cw*0.2, w = cw*0.6, grey = /^(ambiguous|not described)/.test(v);
    return `<g data-tip="${sae(`${E.id} = ${v}: ${E.totals[j]} operations (${spct(E.totals[j],S.meta.rows)}%) in ${E.papers[j]} of ${S.meta.papers} papers`)}">
      <rect x="${x0+j*cw}" y="${top}" width="${cw}" height="${colH}" fill="transparent"/>
      <rect x="${x}" y="${yb-4-hh}" width="${w}" height="${hh}" rx="2" style="fill:${grey?'var(--rule)':col}"/>
      <text x="${x0+j*cw+cw/2}" y="${yb-8-hh}" text-anchor="middle" class="st">${E.totals[j]}</text></g>`; }).join('');
  let lastYear = null;
  const grid = ps.map((p,i)=>{ const y = yb + i*rh, row = E.m[p.id] || [], tot = row.reduce((s,v)=>s+v,0) || 1;
    const sep = p.year!==lastYear ? `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="sgrid"/><text x="4" y="${y+12}" class="st">${p.year}</text>` : ''; lastYear = p.year;
    const cells = row.map((n,j)=>{ const sh = n/tot, x = x0 + j*cw;
      return `<rect x="${x+1}" y="${y+1.5}" width="${cw-2}" height="${rh-3}" rx="2" style="fill:${n?`color-mix(in srgb, ${col} ${Math.round(14+86*sh)}%, var(--surface))`:'var(--surface-2)'}"
        data-tip="${sae(`${p.id} ${(p.system||'').replace(/\s*\(.*$/,'')} · ${E.id} = ${E.values[j]}: ${n} of ${tot} operations (${spct(n,tot)}%)`)}"/>${n?`<text x="${x+cw/2}" y="${y+rh-5}" text-anchor="middle" class="sc${sh>0.45?' inv':''}">${n}</text>`:''}`; }).join('');
    return `${sep}<text x="${lw-8}" y="${y+rh-5}" text-anchor="end" class="sl sdl" data-tip="${sae(`${p.id} (${p.year}) ${p.title}`)}">${sae(`${p.id} ${(p.system||'').replace(/\s*\(.*$/,'').slice(0,24)}`)}</text>${cells}
      <text x="${x0+gw+8}" y="${y+rh-5}" class="st">${tot}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="${sae(E.name)} across papers">${heads}${colbars}
    <text x="${x0+gw+8}" y="${yb-6}" class="st">ops</text>${grid}</svg>`;
}
